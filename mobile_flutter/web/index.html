<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Time2Wish - L'assistant intelligent pour vos anniversaires & célébrations">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Time2Wish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Time2Wish</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var n of names) caches.delete(n);
      });
    }

    // High quality Web Audio synthesizer for UI sound effects
    window.t2wPlaySound = function(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!window._t2wAudioCtx) {
          window._t2wAudioCtx = new AudioCtx();
        }
        const ctx = window._t2wAudioCtx;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;
        if (type === 'click' || type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.035);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.045);
        } else if (type === 'success' || type === 'chime') {
          [523.25, 659.25, 783.99, 1046.50].forEach(function(freq, idx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.12, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.32);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.32);
          });
        } else if (type === 'celebrate') {
          [440, 554.37, 659.25, 880, 1108.73].forEach(function(freq, idx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.14, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.45);
          });
        }
      } catch (e) {
        console.warn('Audio feedback error:', e);
      }
    };

    // File download helper
    window.t2wDownloadFile = function(filename, content, mimeType) {
      try {
        const blob = new Blob([content], { type: mimeType || 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() {
          URL.revokeObjectURL(url);
        }, 1000);
      } catch (e) {
        console.error('File download error:', e);
      }
    };

    // File picker / uploader helper
    window.t2wPickFile = function(accept) {
      return new Promise(function(resolve) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = accept || '.json,application/json,text/plain';
        input.style.display = 'none';
        input.onchange = function(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) {
            resolve('');
            if (input.parentNode) input.parentNode.removeChild(input);
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            resolve(evt.target.result || '');
            if (input.parentNode) input.parentNode.removeChild(input);
          };
          reader.onerror = function() {
            resolve('');
            if (input.parentNode) input.parentNode.removeChild(input);
          };
          reader.readAsText(file);
        };
        document.body.appendChild(input);
        input.click();
      });
    };
  </script>
</head>

  <script src="flutter_bootstrap.js?v=20261031_1838" async></script>
</body>
</html>

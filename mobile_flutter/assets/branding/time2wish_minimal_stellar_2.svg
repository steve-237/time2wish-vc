<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="stellar2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="stellarStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Subtle Ambient Orbit (Time) -->
  <circle cx="60" cy="60" r="46" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="2" 
          stroke-dasharray="4 8" 
          opacity="0.3" />

  <!-- Iconic Monoline '2' (Bridge between Time & Wish) -->
  <path d="M 40 38 
           C 40 24, 52 18, 64 18 
           C 78 18, 86 28, 86 40 
           C 86 54, 76 66, 58 80 
           L 38 94 
           L 86 94" 
        fill="none" 
        stroke="url(#stellar2Grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- The AI Wish Spark crowning the '2' at 2 o'clock -->
  <g transform="translate(86, 22)">
    <path d="M 0 -16 Q 1.5 -3.5 13 0 Q 1.5 3.5 0 16 Q -1.5 3.5 -13 0 Q -1.5 -3.5 0 -16 Z" 
          fill="url(#stellarStarGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="negMedallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="negStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="negShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Solid Bold Medallion Base -->
  <circle cx="60" cy="60" r="48" fill="url(#negMedallion)" filter="url(#negShadow)" />

  <!-- Negative Space Cutouts (White in Dark theme, cuts through the solid disk) -->
  <g fill="#0B0F19">
    <!-- Clock Rim Inset Notch (at 12, 3, 6, 9) -->
    <rect x="58.5" y="16" width="3" height="6" rx="1.5" />
    <rect x="98" y="58.5" width="6" height="3" rx="1.5" />
    <rect x="58.5" y="98" width="3" height="6" rx="1.5" />
    <rect x="16" y="58.5" width="6" height="3" rx="1.5" />

    <!-- Stylized Candle & Clock Hands Cutout -->
    <!-- Candle Base / Hour stem -->
    <rect x="56" y="56" width="8" height="28" rx="4" />
    
    <!-- Minute hand reaching towards 2 o'clock -->
    <path d="M 60 58 L 78 40 Q 81 37 84 40 L 64 62 Z" />
    
    <!-- Candle Flame Cutout -->
    <path d="M 60 36 C 54 44, 55 52, 60 52 C 65 52, 66 44, 60 36 Z" />
  </g>

  <!-- The Glowing AI Wish Star resting at 2 o'clock inside the cut-out orbit -->
  <g transform="translate(86, 32)">
    <path d="M 0 -13 Q 1.5 -2.5 10 0 Q 1.5 2.5 0 13 Q -1.5 2.5 -10 0 Q -1.5 -2.5 0 -13 Z" 
          fill="url(#negStar)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>

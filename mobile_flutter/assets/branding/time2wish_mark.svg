<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Top Crown / Watch Button -->
  <rect x="57" y="2.5" width="6" height="5" rx="1.5" fill="#0EA5E9" />

  <!-- Outer Ring (Solid Electric Cyan - No Gradient, No Outer Glow) -->
  <circle cx="60" cy="60" r="51" fill="#0EA5E9" />

  <!-- Inner Pure White Dial Face (Harmonized with Application Background & Cards) -->
  <circle cx="60" cy="60" r="45" fill="#FFFFFF" />

  <!-- 4 Cardinal Hour Markers in Subtle Slate -->
  <g fill="#CBD5E1">
    <!-- 12 o'clock -->
    <rect x="58.7" y="19" width="2.6" height="6.5" rx="1.3" />
    <!-- 3 o'clock -->
    <rect x="94.5" y="58.7" width="6.5" height="2.6" rx="1.3" />
    <!-- 6 o'clock -->
    <rect x="58.7" y="94.5" width="2.6" height="6.5" rx="1.3" />
    <!-- 9 o'clock -->
    <rect x="19" y="58.7" width="6.5" height="2.6" rx="1.3" />
  </g>

  <!-- Candle Body & 2 O'Clock Hand (Styled in App Primary Cyan #0EA5E9) -->
  <g id="candleStructure">
    <!-- Candle Base Column (towards 6h) -->
    <path d="M 56 60
             L 56 83
             C 56 85.2, 57.8 87, 60 87
             C 62.2 87, 64 85.2, 64 83
             L 64 60
             Z" 
          fill="#0EA5E9" />

    <!-- 2 o'clock Minute Hand (pointed at -30° towards Wish Star) -->
    <path d="M 58 57
             L 79.5 44.5
             C 80.8 43.7, 82.5 45.3, 81.6 46.8
             L 62.5 62
             Z" 
          fill="#0EA5E9" />

    <!-- Center Hub Outer Circle -->
    <circle cx="60" cy="60" r="7.5" fill="#0EA5E9" />

    <!-- Center Hub Core Circle -->
    <circle cx="60" cy="60" r="4" fill="#0284C7" />

    <!-- Center White Pivot Dot -->
    <circle cx="60" cy="60" r="1.6" fill="#FFFFFF" />
  </g>

  <!-- Teardrop Candle Flame (Solid Coral #F97316 & Sun Gold #FBBF24) -->
  <!-- Outer Flame -->
  <path d="M 60 27.5
           C 54.5 35, 51.5 42, 53 47.5
           C 54.5 52.5, 57.2 54.5, 60 54.5
           C 62.8 54.5, 65.5 52.5, 67 47.5
           C 68.5 42, 65.5 35, 60 27.5 Z" 
        fill="#F97316" />

  <!-- Inner Flame Core -->
  <path d="M 60 36.5
           C 57.5 41, 56.5 45, 57.5 48.5
           C 58.2 51, 59.1 52, 60 52
           C 60.9 52, 61.8 51, 62.5 48.5
           C 63.5 45, 62.5 41, 60 36.5 Z" 
        fill="#FBBF24" />

  <!-- Celestial AI Wish Spark at 2 O'Clock (Point of Arrival) -->
  <g transform="translate(86.5, 41)">
    <!-- 4-Pointed Star in Solar Gold -->
    <path d="M 0 -13
             Q 1.2 -2.5 7.5 0
             Q 1.2 2.5 0 13
             Q -1.2 2.5 -7.5 0
             Q -1.2 -2.5 0 -13 Z" 
          fill="#F59E0B" />

    <!-- Inner Core Spark in White -->
    <path d="M 0 -5
             Q 0.5 -1 3 0
             Q 0.5 1 0 5
             Q -0.5 1 -3 0
             Q -0.5 -1 0 -5 Z" 
          fill="#FFFFFF" opacity="0.9" />

    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
  </g>
</svg>
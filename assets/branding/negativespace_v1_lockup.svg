<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="lMedallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0EA5E9" />
      <stop offset="75%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="lFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="lStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="lTextWish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="lShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left: Scaled Mark (Centered at x=45, y=45, scale ~0.65) -->
  <g transform="translate(10, 8) scale(0.62)">
    <circle cx="60" cy="60" r="50" fill="url(#lMedallion)" filter="url(#lShadow)" />
    <circle cx="60" cy="60" r="46.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
    <g fill="#FFFFFF">
      <rect x="58" y="15" width="4" height="9" rx="2" />
      <rect x="96" y="58" width="9" height="4" rx="2" />
      <rect x="58" y="96" width="4" height="9" rx="2" />
      <rect x="15" y="58" width="9" height="4" rx="2" />
      <rect x="54" y="52" width="12" height="36" rx="6" />
      <path d="M 58 56 L 81 36 C 83 34, 86 36, 85 38 L 64 63 Z" />
      <circle cx="60" cy="58" r="4.5" fill="#0EA5E9" />
      <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
    </g>
    <path d="M 60 22 C 51 32, 52 46, 60 46 C 68 46, 69 32, 60 22 Z" fill="url(#lFlame)" />
    <circle cx="60" cy="38" r="3" fill="#FFFFFF" />
    <g transform="translate(86, 30)">
      <path d="M 0 -17 Q 1.8 -3.5 13 0 Q 1.8 3.5 0 17 Q -1.8 3.5 -13 0 Q -1.8 -3.5 0 -17 Z" fill="url(#lStar)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Modern Brand Typography -->
  <g transform="translate(95, 52)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#0EA5E9" font-weight="800">2</tspan>
      <tspan fill="url(#lTextWish)">Wish</tspan>
    </text>
    
    <text x="2" y="20" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.8" 
          fill="#94A3B8" 
          text-transform="uppercase">AI CELEBRATIONS &amp; REMINDERS</text>
  </g>
</svg>

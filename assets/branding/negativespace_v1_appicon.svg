<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="appBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="appGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="appMedallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0EA5E9" />
      <stop offset="75%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="appFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="appStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#appBg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#appBorder)" stroke-width="3" />

  <!-- Ambient Light Halo -->
  <circle cx="256" cy="256" r="190" fill="url(#appGlow)" />

  <!-- Centered Scaled Negative Space Medallion (Scale ~3.2, Center at 256, 256) -->
  <g transform="translate(256, 256) scale(3.1) translate(-60, -60)">
    <circle cx="60" cy="60" r="50" fill="url(#appMedallion)" filter="url(#appShadow)" />
    <circle cx="60" cy="60" r="46.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />
    <path d="M 22 48 C 28 26, 42 16, 60 16 C 78 16, 92 26, 98 48 C 84 34, 70 28, 60 28 C 50 28, 36 34, 22 48 Z" fill="#FFFFFF" opacity="0.12" />
    <g fill="#FFFFFF">
      <rect x="58" y="15" width="4" height="9" rx="2" />
      <rect x="96" y="58" width="9" height="4" rx="2" />
      <rect x="58" y="96" width="4" height="9" rx="2" />
      <rect x="15" y="58" width="9" height="4" rx="2" />
      <circle cx="82" cy="28" r="1.8" opacity="0.45" />
      <circle cx="92" cy="42" r="1.8" opacity="0.45" />
      <circle cx="92" cy="78" r="1.8" opacity="0.45" />
      <circle cx="82" cy="92" r="1.8" opacity="0.45" />
      <circle cx="38" cy="92" r="1.8" opacity="0.45" />
      <circle cx="28" cy="78" r="1.8" opacity="0.45" />
      <circle cx="28" cy="42" r="1.8" opacity="0.45" />
      <circle cx="38" cy="28" r="1.8" opacity="0.45" />
      <rect x="54" y="52" width="12" height="36" rx="6" />
      <path d="M 58 56 L 81 36 C 83 34, 86 36, 85 38 L 64 63 Z" />
      <circle cx="60" cy="58" r="4.5" fill="#0EA5E9" />
      <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
    </g>
    <path d="M 60 22 C 51 32, 52 46, 60 46 C 68 46, 69 32, 60 22 Z" fill="url(#appFlame)" />
    <circle cx="60" cy="38" r="3" fill="#FFFFFF" />
    <g transform="translate(86, 30)">
      <path d="M 0 -17 Q 1.8 -3.5 13 0 Q 1.8 3.5 0 17 Q -1.8 3.5 -13 0 Q -1.8 -3.5 0 -17 Z" fill="url(#appStar)" />
      <path d="M 0 -7 Q 0.8 -1.5 6 0 Q 0.8 1.5 0 7 Q -0.8 1.5 -6 0 Q -0.8 -1.5 0 -7 Z" fill="#FFFFFF" transform="rotate(45)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>

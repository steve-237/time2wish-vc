<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Top Crown / Watch Button -->
  <rect x="57" y="3" width="6" height="4.5" rx="1.5" fill="#0EA5E9" />

  <!-- Outer Ring (Solid Electric Cyan - 100% Transparent Inside and Outside) -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#0EA5E9" stroke-width="4.5" />

  <!-- 4 Cardinal Hour Markers (Cyan Ciel) -->
  <g fill="#0EA5E9">
    <rect x="58.8" y="18.5" width="2.4" height="6" rx="1.2" />
    <rect x="95.5" y="58.8" width="6" height="2.4" rx="1.2" />
    <rect x="58.8" y="95.5" width="2.4" height="6" rx="1.2" />
    <rect x="18.5" y="58.8" width="6" height="2.4" rx="1.2" />
  </g>

  <!-- Candle Structure & 2 O'Clock Hand (Cyan Ciel & Violet - No Solid Background) -->
  <g id="candleStructure">
    <!-- Candle Base Column (towards 6h) -->
    <path d="M 56.2 60
             L 56.2 82
             C 56.2 84.1, 57.9 85.8, 60 85.8
             C 62.1 85.8, 63.8 84.1, 63.8 82
             L 63.8 60
             Z" 
          fill="#0EA5E9" />

    <!-- 2 o'clock Minute Hand (pointed at -30° towards Wish Star) -->
    <path d="M 58 57
             L 79.5 44.5
             C 80.8 43.7, 82.5 45.3, 81.6 46.8
             L 62.5 62
             Z" 
          fill="#0EA5E9" />

    <!-- Center Hub Outer Circle (Cyan) -->
    <circle cx="60" cy="60" r="7" fill="#0EA5E9" />

    <!-- Center Hub Core Circle (Violet) -->
    <circle cx="60" cy="60" r="3.8" fill="#8B5CF6" />

    <!-- Center Pivot Dot (White) -->
    <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Teardrop Candle Flame (Solid Coral #F97316 & Sun Gold #FBBF24) -->
  <!-- Outer Flame -->
  <path d="M 60 27.5
           C 54.5 35, 51.5 42, 53 47.5
           C 54.5 52.5, 57.2 54.5, 60 54.5
           C 62.8 54.5, 65.5 52.5, 67 47.5
           C 68.5 42, 65.5 35, 60 27.5 Z" 
        fill="#F97316" />

  <!-- Inner Flame Core -->
  <path d="M 60 36.5
           C 57.5 41, 56.5 45, 57.5 48.5
           C 58.2 51, 59.1 52, 60 52
           C 60.9 52, 61.8 51, 62.5 48.5
           C 63.5 45, 62.5 41, 60 36.5 Z" 
        fill="#FBBF24" />

  <!-- Celestial AI Wish Spark at 2 O'Clock -->
  <g transform="translate(86.5, 41)">
    <!-- 4-Pointed Star in Solar Gold -->
    <path d="M 0 -13
             Q 1.2 -2.5 7.5 0
             Q 1.2 2.5 0 13
             Q -1.2 2.5 -7.5 0
             Q -1.2 -2.5 0 -13 Z" 
          fill="#F59E0B" />

    <!-- Inner Core Spark in White -->
    <path d="M 0 -5
             Q 0.5 -1 3 0
             Q 0.5 1 0 5
             Q -0.5 1 -3 0
             Q -0.5 -1 0 -5 Z" 
          fill="#FFFFFF" opacity="0.9" />

    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
  </g>
</svg>
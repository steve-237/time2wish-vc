<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="candleRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="candleFlameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Dynamic Orbital Ring (Time & Annual Orbit) -->
  <ellipse cx="60" cy="68" rx="48" ry="18" 
           fill="none" 
           stroke="url(#candleRingGrad)" 
           stroke-width="5.5" 
           transform="rotate(-24, 60, 68)" />

  <!-- Minimalist Candle Body (Celebration) -->
  <rect x="55" y="52" width="10" height="34" rx="5" 
        fill="#FFFFFF" />

  <!-- Candle Wick -->
  <line x1="60" y1="52" x2="60" y2="44" 
        stroke="#94A3B8" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- The Magic AI Wish Flame / Spark -->
  <g transform="translate(60, 30)">
    <!-- 4-point flame star -->
    <path d="M 0 -17 Q 1.5 -3.5 12 0 Q 1.5 3.5 0 17 Q -1.5 3.5 -12 0 Q -1.5 -3.5 0 -17 Z" 
          fill="url(#candleFlameGrad)" />
    <!-- Bright inner core -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <linearGradient id="lockupBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="25%" stop-color="#0066FF" />
      <stop offset="65%" stop-color="#5522FA" />
      <stop offset="100%" stop-color="#9D2BFF" />
    </linearGradient>

    <linearGradient id="lockupFlameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="30%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <linearGradient id="lockupFlameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="60%" stop-color="#FFF4B8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="lockupStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFCA00" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <filter id="lockupGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0066FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(6, 0)">
    <!-- Outer Ring -->
    <circle cx="60" cy="60" r="48" fill="url(#lockupBezel)" filter="url(#lockupGlow)" />
    <!-- Inner Navy -->
    <circle cx="60" cy="60" r="41.5" fill="#081432" />

    <!-- 4 Ticks -->
    <g fill="#FFFFFF">
      <rect x="58.7" y="21.5" width="2.6" height="6.5" rx="1.3" />
      <rect x="92" y="58.7" width="6.5" height="2.6" rx="1.3" />
      <rect x="58.7" y="92" width="2.6" height="6.5" rx="1.3" />
      <rect x="21.5" y="58.7" width="6.5" height="2.6" rx="1.3" />
    </g>

    <!-- Candle Body & Hand -->
    <g id="lockupCandle">
      <path d="M 55.6 60 L 55.6 82 C 55.6 84.4, 57.6 86.4, 60 86.4 C 62.4 86.4, 64.4 84.4, 64.4 82 L 64.4 60 Z" fill="#FFFFFF" />
      <path d="M 58 57 L 78.5 45 C 80 44.2, 81.6 45.8, 80.8 47.3 L 62.5 62 Z" fill="#FFFFFF" />
      <circle cx="60" cy="60" r="7.5" fill="#FFFFFF" />
      <circle cx="60" cy="60" r="4" fill="#0080FF" />
      <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Flame -->
    <path d="M 60 29 C 55 36, 52 42.5, 53.5 47.8 C 55 52.5, 57.4 54.5, 60 54.5 C 62.6 54.5, 65 52.5, 66.5 47.8 C 68 42.5, 65 36, 60 29 Z" fill="url(#lockupFlameOuter)" />
    <path d="M 60 37.5 C 57.8 41.5, 56.8 45.5, 57.8 48.8 C 58.4 51, 59.2 52, 60 52 C 60.8 52, 61.6 51, 62.2 48.8 C 63.2 45.5, 62.2 41.5, 60 37.5 Z" fill="url(#lockupFlameInner)" />

    <!-- 2h Spark -->
    <g transform="translate(85, 41.5)">
      <path d="M 0 -12.5 Q 1.1 -2.2 7.2 0 Q 1.1 2.2 0 12.5 Q -1.1 2.2 -7.2 0 Q -1.1 -2.2 0 -12.5 Z" fill="url(#lockupStar)" />
      <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(136, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#00A3FF">2</tspan>
      <tspan fill="#9D2BFF">Wish</tspan>
    </text>

    <!-- Subtitle Badge / Tagline -->
    <text x="3" y="88" font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2.4">
      AI CELEBRATION ASSISTANT
    </text>

    <!-- Micro AI Spark Accent -->
    <g transform="translate(315, 36)">
      <path d="M 0 -6 Q 0.8 -1.2 5 0 Q 0.8 1.2 0 6 Q -0.8 1.2 -5 0 Q -0.8 -1.2 0 -6 Z" fill="#FFCA00" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>

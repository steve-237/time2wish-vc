<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <!-- Left Emblem (100% Transparent Vector) -->
  <g transform="translate(6, 0)">
    <!-- Watch Crown Button -->
    <rect x="57" y="3" width="6" height="4.5" rx="1.5" fill="#0EA5E9" />
    
    <!-- Outer Ring (Transparent Inside & Outside) -->
    <circle cx="60" cy="60" r="48" fill="none" stroke="#0EA5E9" stroke-width="4.5" />

    <!-- 4 Cardinal Ticks -->
    <g fill="#0EA5E9">
      <rect x="58.8" y="18.5" width="2.4" height="6" rx="1.2" />
      <rect x="95.5" y="58.8" width="6" height="2.4" rx="1.2" />
      <rect x="58.8" y="95.5" width="2.4" height="6" rx="1.2" />
      <rect x="18.5" y="58.8" width="6" height="2.4" rx="1.2" />
    </g>

    <!-- Candle Body & 2h Hand in Cyan Ciel -->
    <g id="lockupCandle">
      <path d="M 56.2 60 L 56.2 82 C 56.2 84.1, 57.9 85.8, 60 85.8 C 62.1 85.8, 63.8 84.1, 63.8 82 L 63.8 60 Z" fill="#0EA5E9" />
      <path d="M 58 57 L 78.5 45 C 79.8 44.2, 81.4 45.8, 80.6 47.3 L 62.5 62 Z" fill="#0EA5E9" />
      <circle cx="60" cy="60" r="7" fill="#0EA5E9" />
      <circle cx="60" cy="60" r="3.8" fill="#8B5CF6" />
      <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Flame in Coral & Sun Gold -->
    <path d="M 60 27.5 C 54.5 35, 51.5 42, 53 47.5 C 54.5 52.5, 57.2 54.5, 60 54.5 C 62.8 54.5, 65.5 52.5, 67 47.5 C 68.5 42, 65.5 35, 60 27.5 Z" fill="#F97316" />
    <path d="M 60 36.5 C 57.5 41, 56.5 45, 57.5 48.5 C 58.2 51, 59.1 52, 60 52 C 60.9 52, 61.8 51, 62.5 48.5 C 63.5 45, 62.5 41, 60 36.5 Z" fill="#FBBF24" />

    <!-- 2h AI Wish Spark -->
    <g transform="translate(86.5, 41)">
      <path d="M 0 -13 Q 1.2 -2.5 7.5 0 Q 1.2 2.5 0 13 Q -1.2 2.5 -7.5 0 Q -1.2 -2.5 0 -13 Z" fill="#F59E0B" />
      <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Side (Clean, High-Contrast Brand Typography) -->
  <g transform="translate(136, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#0F172A">Time</tspan>
      <tspan fill="#0EA5E9">2</tspan>
      <tspan fill="#8B5CF6">Wish</tspan>
    </text>

    <!-- Tagline -->
    <text x="3" y="88" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="2">
      L'ASSISTANT DES ANNIVERSAIRES &amp; CÉLÉBRATIONS
    </text>

    <!-- Micro AI Spark Accent -->
    <g transform="translate(390, 36)">
      <path d="M 0 -6 Q 0.8 -1.2 5 0 Q 0.8 1.2 0 6 Q -0.8 1.2 -5 0 Q -0.8 -1.2 0 -6 Z" fill="#F59E0B" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Master Medallion Gradient -->
    <linearGradient id="medallionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#0EA5E9" />
      <stop offset="75%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <radialGradient id="flameInner" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow & Flare -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Solid Bold Medallion Base with Drop Shadow -->
  <circle cx="60" cy="60" r="50" fill="url(#medallionGrad)" filter="url(#badgeShadow)" />

  <!-- 2. Subtle Precision Inner Bezel Ring -->
  <circle cx="60" cy="60" r="46.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" />

  <!-- 3. Top Glass Sheen Arc (Subtle Luxury Depth) -->
  <path d="M 22 48 C 28 26, 42 16, 60 16 C 78 16, 92 26, 98 48 C 84 34, 70 28, 60 28 C 50 28, 36 34, 22 48 Z" 
        fill="#FFFFFF" opacity="0.12" />

  <!-- 4. Clock Hour Ticks (Crisp Negative Space) -->
  <g fill="#FFFFFF">
    <!-- 12 o'clock -->
    <rect x="58" y="15" width="4" height="9" rx="2" />
    <!-- 3 o'clock -->
    <rect x="96" y="58" width="9" height="4" rx="2" />
    <!-- 6 o'clock -->
    <rect x="58" y="96" width="4" height="9" rx="2" />
    <!-- 9 o'clock -->
    <rect x="15" y="58" width="9" height="4" rx="2" />

    <!-- Delicate Micro-Ticks for Watchmaker Precision -->
    <circle cx="82" cy="28" r="1.8" opacity="0.45" />
    <circle cx="92" cy="42" r="1.8" opacity="0.45" />
    <circle cx="92" cy="78" r="1.8" opacity="0.45" />
    <circle cx="82" cy="92" r="1.8" opacity="0.45" />
    <circle cx="38" cy="92" r="1.8" opacity="0.45" />
    <circle cx="28" cy="78" r="1.8" opacity="0.45" />
    <circle cx="28" cy="42" r="1.8" opacity="0.45" />
    <circle cx="38" cy="28" r="1.8" opacity="0.45" />
  </g>

  <!-- 5. Sculptural Candle & Hand (Seamless Negative Space Architecture) -->
  <g fill="#FFFFFF">
    <!-- Candle Base / 6 o'clock Pillar -->
    <rect x="54" y="52" width="12" height="36" rx="6" />

    <!-- Tapered Aerodynamic Minute Hand to 2 o'clock -->
    <path d="M 58 56 
             L 81 36 
             C 83 34, 86 36, 85 38 
             L 64 63 
             Z" />

    <!-- Seamless Smooth Joint Fillet -->
    <path d="M 54 58 Q 54 52 60 52 Q 66 52 66 58 Z" />

    <!-- Precision Pivot Ring -->
    <circle cx="60" cy="58" r="4.5" fill="#0EA5E9" />
    <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- 6. Candle Flame (Central Stage, Incandescent Dual-Layer Flame) -->
  <!-- Ambient Soft Halo -->
  <circle cx="60" cy="36" r="16" fill="url(#ambientGlow)" />
  
  <!-- Outer Teardrop Flame -->
  <path d="M 60 22 C 51 32, 52 46, 60 46 C 68 46, 69 32, 60 22 Z" 
        fill="url(#flameOuter)" />
        
  <!-- Inner White-Hot Flame Core -->
  <path d="M 60 29 C 55 35, 56 42, 60 42 C 64 42, 65 35, 60 29 Z" 
        fill="url(#flameInner)" />

  <!-- 7. The Wish Star at 2 O'Clock (Point of Arrival, 4-Point AI Spark) -->
  <g transform="translate(86, 30)" filter="url(#starGlow)">
    <!-- Primary 4-pointed Diamond Star -->
    <path d="M 0 -17 Q 1.8 -3.5 13 0 Q 1.8 3.5 0 17 Q -1.8 3.5 -13 0 Q -1.8 -3.5 0 -17 Z" 
          fill="url(#starGrad)" />

    <!-- 45-degree Diagonal Micro-Flare -->
    <path d="M 0 -7 Q 0.8 -1.5 6 0 Q 0.8 1.5 0 7 Q -0.8 1.5 -6 0 Q -0.8 -1.5 0 -7 Z" 
          fill="#FFFFFF" transform="rotate(45)" opacity="0.9" />

    <!-- Ultra-Bright Diamond Core -->
    <circle cx="0" cy="0" r="2.4" fill="#FFFFFF" />

    <!-- Joyful Stardust Specks -->
    <circle cx="12" cy="-7" r="1.4" fill="#FEF08A" opacity="0.85" />
    <circle cx="-9" cy="-10" r="1.1" fill="#FBBF24" opacity="0.75" />
  </g>
</svg>

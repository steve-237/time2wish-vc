spring:
  application:
    name: time2wish-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/time2wish
    username: time2wish_user
    password: time2wish_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

server:
  port: 8081

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  email:
    output-dir: scratch/emails
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash

# spring:
#   sendgrid:
#     api-key: YOUR_SENDGRID_API_KEY_HERE

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:time2wish}
    username: ${DB_USER:time2wish_user}
    password: ${DB_PASSWORD:time2wish_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}

app:

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: time2wish-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:time2wish}
    username: ${DB_USER:time2wish_user}
    password: ${DB_PASSWORD:time2wish_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

server:
  port: 8081

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKeyForDevelopmentOnlyPleaseChangeInProductionTime2Wish}
  email:
    output-dir: scratch/emails
    from-address: ${EMAIL_FROM:${SMTP_USER:}}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:}
    model: ${HUGGINGFACE_MODEL:stabilityai/stable-diffusion-xl-base-1.0}
  google:
    client-id: ${GOOGLE_CLIENT_ID:factice-google-client-id.apps.googleusercontent.com}

# spring:
#   sendgrid:
#     api-key: YOUR_SENDGRID_API_KEY_HERE

logging:
  file:
    name: scratch/logs/time2wish.log
  level:
    app.time2wish: DEBUG
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:time2wish}${DB_OPTIONS:}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  jwt:
    secret: ${JWT_SECRET}


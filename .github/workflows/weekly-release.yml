name: Weekly Sunday Web & Mobile Release

on:
  schedule:
    # Chaque dimanche à 19h00 (Heure de Paris / CET UTC+1 -> 18:00 UTC)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Weekly Release (Web & Mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 1. SETUP ENVIRONMENTS
      # ---------------------------------------------------------
      - name: Set up Node.js 20 (Angular Web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Set up JDK 17 (Android Build)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter (Flutter Web & Mobile)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ---------------------------------------------------------
      # 2. BUILD WEB APPLICATION (ANGULAR FRONTEND)
      # ---------------------------------------------------------
      - name: Build Web Application (Angular)
        run: |
          cd frontend
          npm ci
          npm run build

      # ---------------------------------------------------------
      # 3. BUILD FLUTTER WEB & ANDROID APK
      # ---------------------------------------------------------
      - name: Install Flutter Dependencies & Run Tests
        run: |
          cd mobile_flutter
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter Web Bundle
        run: |
          cd mobile_flutter
          flutter build web --release

      - name: Build Android APK
        run: |
          cd mobile_flutter
          flutter build apk --debug

      # ---------------------------------------------------------
      # 4. PREPARE RELEASE ARTIFACTS
      # ---------------------------------------------------------
      - name: Package Artifacts
        id: prep
        run: |
          mkdir -p release-assets

          # Package Main Angular Web App
          cd frontend/dist/frontend/browser
          zip -r ../../../release-assets/Time2Wish-Web.zip .
          zip -r ../../../release-assets/Time2Wish-Web-Angular.zip .
          cd ../../..

          # Package Flutter Web App
          cd mobile_flutter/build/web
          zip -r ../../../release-assets/Time2Wish-Web-Flutter.zip .
          cd ../../..

          # Package Android APK
          cp mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk release-assets/Time2Wish-Android.apk

          # Date & Tag calculation
          DATE_STR=$(date +'%Y.%m.%d')
          TAG_NAME="v${DATE_STR}-weekly"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=Time2Wish Weekly Release - $DATE_STR" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 5. GENERATE CHANGELOG & RELEASE NOTES
      # ---------------------------------------------------------
      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "### 🌟 Time2Wish Weekly Release ($(date +'%d/%m/%Y'))" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Release automatique hebdomadaire du dimanche à 19h00 (Web & Mobile)." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "#### 📦 Fichiers et Assets disponibles :" >> RELEASE_NOTES.md
          echo "- **Application Web Principale (Angular)** : \`Time2Wish-Web.zip\` (ou \`Time2Wish-Web-Angular.zip\`)" >> RELEASE_NOTES.md
          echo "- **Application Web (Flutter)** : \`Time2Wish-Web-Flutter.zip\`" >> RELEASE_NOTES.md
          echo "- **Application Mobile Android (APK)** : \`Time2Wish-Android.apk\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "#### 📝 Derniers commits :" >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --oneline --no-merges | sed 's/^/- /' >> RELEASE_NOTES.md
          else
            git log -n 15 --oneline --no-merges | sed 's/^/- /' >> RELEASE_NOTES.md
          fi

      # ---------------------------------------------------------
      # 6. PUBLISH GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ steps.prep.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-assets/Time2Wish-Web.zip
            release-assets/Time2Wish-Web-Angular.zip
            release-assets/Time2Wish-Web-Flutter.zip
            release-assets/Time2Wish-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Mobile CI/CD (Flutter)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile_flutter/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile_flutter/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  analyze:
    name: Flutter Analyze & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test

  build-web:
    name: Build Flutter Web Release
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: time2wish-mobile-web
          path: mobile_flutter/build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Time2Wish-Android-APK
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

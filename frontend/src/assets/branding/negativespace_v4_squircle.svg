<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="v4Squircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="v4Disk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="v4Star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="v4Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#v4Squircle)" filter="url(#v4Shadow)" />
  <rect x="6" y="6" width="108" height="108" rx="28" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" />

  <!-- Central Vibrant Clock Dial -->
  <circle cx="60" cy="60" r="42" fill="url(#v4Disk)" />
  <circle cx="60" cy="60" r="39" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />

  <!-- Negative Space Elements (Crisp Solid White) -->
  <g fill="#FFFFFF">
    <!-- Hour Ticks at 12, 3, 6, 9 -->
    <rect x="58.5" y="22" width="3" height="6" rx="1.5" />
    <rect x="92" y="58.5" width="6" height="3" rx="1.5" />
    <rect x="58.5" y="92" width="3" height="6" rx="1.5" />
    <rect x="22" y="58.5" width="6" height="3" rx="1.5" />

    <!-- Candle Body (Vertical axis) -->
    <rect x="54" y="54" width="12" height="28" rx="6" />

    <!-- Minute Hand pointing towards 2 o'clock -->
    <path d="M 59 58 L 77 40 Q 80 37 83 40 L 63 62 Z" />

    <!-- Center Pivot -->
    <circle cx="60" cy="58" r="4" fill="#0EA5E9" />
  </g>

  <!-- Candle Flame (Amber-Gold Teardrop) -->
  <path d="M 60 32 C 53 40, 54 48, 60 48 C 66 48, 67 40, 60 32 Z" 
        fill="url(#v4Star)" />
  <circle cx="60" cy="42" r="2.5" fill="#FFFFFF" />

  <!-- The 2 O'Clock Wish Star Burst -->
  <g transform="translate(83, 34)">
    <path d="M 0 -13 Q 1.5 -2.5 10 0 Q 1.5 2.5 0 13 Q -1.5 2.5 -10 0 Q -1.5 -2.5 0 -13 Z" 
          fill="url(#v4Star)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>

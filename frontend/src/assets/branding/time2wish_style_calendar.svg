<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="calBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="num2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="calStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="calShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Calendar Page Base with Shadow -->
  <rect x="22" y="24" width="76" height="76" rx="18" 
        fill="url(#calBody)" stroke="#334155" stroke-width="2" filter="url(#calShadow)" />

  <!-- Calendar Top Header Band -->
  <path d="M 22 42 L 22 36 C 22 26, 30 24, 40 24 L 80 24 C 90 24, 98 26, 98 36 L 98 42 Z" 
        fill="url(#calHeader)" />

  <!-- Two Binder Ring Pillars on Top -->
  <!-- Left Ring -->
  <rect x="38" y="16" width="6" height="14" rx="3" fill="#FFFFFF" />
  <rect x="38" y="19" width="6" height="8" rx="2" fill="#0EA5E9" />
  
  <!-- Right Ring -->
  <rect x="76" y="16" width="6" height="14" rx="3" fill="#FFFFFF" />
  <rect x="76" y="19" width="6" height="8" rx="2" fill="#6366F1" />

  <!-- Calendar Content: The Big Bold "2" (Time '2' Wish) -->
  <path d="M 46 60 
           C 46 52, 52 48, 60 48 
           C 68 48, 74 53, 74 60 
           C 74 68, 68 76, 56 84 
           L 46 91 
           L 75 91" 
        fill="none" 
        stroke="url(#num2Grad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- The AI Wish Spark in the top-right corner of the calendar -->
  <g transform="translate(80, 52)">
    <path d="M 0 -13 Q 1.5 -2.5 10 0 Q 1.5 2.5 0 13 Q -1.5 2.5 -10 0 Q -1.5 -2.5 0 -13 Z" 
          fill="url(#calStar)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Micro birthday indicator dot -->
  <circle cx="48" cy="74" r="2.5" fill="#F43F5E" />
</svg>

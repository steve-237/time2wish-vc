<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c1LockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="c1LockStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="c1TextWish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Left: Concept 1 Mark (Scaled to 74x74, centered at x=45, y=45) -->
  <g transform="translate(10, 8) scale(0.62)">
    <circle cx="60" cy="60" r="46" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 8" opacity="0.35" />
    <path d="M 40 38 C 40 22, 54 16, 66 16 C 80 16, 88 26, 88 38 C 88 52, 78 66, 60 80 L 38 94 L 88 94" fill="none" stroke="url(#c1LockGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(88, 20)">
      <path d="M 0 -18 Q 1.5 -3.5 14 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -14 0 Q -1.5 -3.5 0 -18 Z" fill="url(#c1LockStar)" />
      <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Modern Typography -->
  <g transform="translate(95, 52)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#38BDF8" font-weight="800">2</tspan>
      <tspan fill="url(#c1TextWish)">Wish</tspan>
    </text>
    
    <text x="2" y="20" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.8" 
          fill="#94A3B8" 
          text-transform="uppercase">AI CELEBRATIONS &amp; MOMENTS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <radialGradient id="lockupTwilight" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>
    <linearGradient id="lockupBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="lockupSpecular" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#BAE6FD" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="lockupFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="25%" stop-color="#F97316" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <radialGradient id="lockupFlameCore" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lockupAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lockupStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="lockupGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Logo Emblem -->
  <g transform="translate(6, 0)">
    <!-- Medallion -->
    <g filter="url(#lockupGlow)">
      <circle cx="60" cy="60" r="48" fill="url(#lockupTwilight)" />
      <circle cx="60" cy="60" r="47" fill="none" stroke="url(#lockupBezel)" stroke-width="2" />
      <circle cx="60" cy="60" r="46" fill="none" stroke="url(#lockupSpecular)" stroke-width="1" />
    </g>

    <!-- Dial Track -->
    <circle cx="60" cy="60" r="41" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="1.5 5" opacity="0.35" />

    <!-- Markers -->
    <g fill="#F8FAFC" opacity="0.9">
      <path d="M 59 19 L 61 19 L 61.5 25 L 58.5 25 Z" />
      <path d="M 101 59 L 101 61 L 95 61.5 L 95 58.5 Z" />
      <path d="M 59 101 L 61 101 L 61.5 95 L 58.5 95 Z" />
      <path d="M 19 59 L 19 61 L 25 61.5 L 25 58.5 Z" />
    </g>

    <!-- Sheen -->
    <path d="M 26 46 C 34 26, 46 19, 60 19 C 74 19, 86 26, 94 46 C 80 33, 68 27, 60 27 C 52 27, 40 33, 26 46 Z" fill="#FFFFFF" opacity="0.1" />

    <!-- Sculpture -->
    <g id="lockupSculpture">
      <path d="M 53.5 58 C 53.5 52, 57 51, 60 51 C 63 51, 66.5 52, 66.5 58 L 66.5 86 C 66.5 90, 63.5 93, 60 93 C 56.5 93, 53.5 90, 53.5 86 Z" fill="#FFFFFF" />
      <path d="M 60 58 L 85 38.5 C 86.5 37.5, 87.5 39, 86 40 L 62 62 Z" fill="#FFFFFF" />
      <path d="M 60 58 L 86 40 L 61 63 C 60 62, 59.5 60, 60 58 Z" fill="#E2E8F0" />
      <circle cx="60" cy="58" r="4.8" fill="#0EA5E9" />
      <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Flame -->
    <ellipse cx="60" cy="34" rx="17" ry="19" fill="url(#lockupAura)" />
    <path d="M 60 18 C 57 24, 49 32, 50 40 C 51 46, 56 49, 60 49 C 64 49, 69 46, 70 40 C 71 32, 63 24, 60 18 Z" fill="url(#lockupFlame)" />
    <path d="M 60 26 C 58 30, 54 35, 55 41 C 56 45, 58 46.5, 60 46.5 C 62 46.5, 64 45, 65 41 C 66 35, 62 30, 60 26 Z" fill="url(#lockupFlameCore)" />

    <!-- 2h Spark -->
    <g transform="translate(88, 36)">
      <path d="M 0 -12 Q 1.5 -2.5 9 0 Q 1.5 2.5 0 12 Q -1.5 2.5 -9 0 Q -1.5 -2.5 0 -12 Z" fill="url(#lockupStar)" />
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(136, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#38BDF8">2</tspan>
      <tspan fill="#A855F7">Wish</tspan>
    </text>

    <!-- Subtitle Badge / Tagline -->
    <text x="3" y="88" font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2.4">
      AI CELEBRATION ASSISTANT
    </text>

    <!-- Micro AI Spark Accent on Title -->
    <g transform="translate(315, 36)">
      <path d="M 0 -6 Q 0.8 -1.2 5 0 Q 0.8 1.2 0 6 Q -0.8 1.2 -5 0 Q -0.8 -1.2 0 -6 Z" fill="#FBBF24" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Ribbon Gradients -->
    <linearGradient id="ribbonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="ribbonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="ribbonOverlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="ribbonStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Ribbon Loop 1 (Cyan to Indigo: Clock/Infinity Left Wing) -->
  <path d="M 24 64 
           C 24 38, 44 24, 64 24 
           C 84 24, 96 38, 96 52 
           C 96 66, 84 76, 70 82 
           L 46 94" 
        fill="none" 
        stroke="url(#ribbonCyan)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#ribbonShadow)" />

  <!-- Foreground Ribbon Loop 2 (Violet to Pink: Wish & Celebration Right Wing) -->
  <path d="M 96 56 
           C 96 82, 76 96, 56 96 
           C 36 96, 24 82, 24 68 
           C 24 54, 36 44, 50 38 
           L 74 26" 
        fill="none" 
        stroke="url(#ribbonPurple)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#ribbonShadow)" />

  <!-- Intersection Fold (Creates the 3D Origami Overlap Illusion) -->
  <path d="M 46 54 Q 60 60 74 66" 
        fill="none" 
        stroke="url(#ribbonOverlap)" 
        stroke-width="14" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Radiant Wish Star at the Top Convergence (2 o'clock) -->
  <g transform="translate(86, 26)" filter="url(#ribbonShadow)">
    <path d="M 0 -17 Q 2 -3.5 13 0 Q 2 3.5 0 17 Q -2 3.5 -13 0 Q -2 -3.5 0 -17 Z" 
          fill="url(#ribbonStar)" />
    <!-- Center Core -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#161F33" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="sqBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="sqGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c2IconRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="c2IconFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="c2IconFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#sqBg2)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#sqBorder2)" stroke-width="3" />

  <!-- Ambient Light -->
  <circle cx="256" cy="240" r="180" fill="url(#sqGlow2)" />

  <!-- Centered Scaled Icon Mark -->
  <g transform="translate(256, 256) scale(3.1) translate(-60, -60)">
    <ellipse cx="60" cy="68" rx="48" ry="18" fill="none" stroke="url(#c2IconRing)" stroke-width="5.5" transform="rotate(-24, 60, 68)" />
    <rect x="55" y="52" width="10" height="34" rx="5" fill="#FFFFFF" />
    <line x1="60" y1="52" x2="60" y2="44" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <g transform="translate(60, 30)" filter="url(#c2IconFilter)">
      <path d="M 0 -17 Q 1.5 -3.5 12 0 Q 1.5 3.5 0 17 Q -1.5 3.5 -12 0 Q -1.5 -3.5 0 -17 Z" fill="url(#c2IconFlame)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>

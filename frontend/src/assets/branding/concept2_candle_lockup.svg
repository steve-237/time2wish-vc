<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c2LockRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="c2LockFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="c2LockWish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Left: Concept 2 Mark (Scaled) -->
  <g transform="translate(12, 10) scale(0.62)">
    <ellipse cx="60" cy="68" rx="48" ry="18" fill="none" stroke="url(#c2LockRing)" stroke-width="6" transform="rotate(-24, 60, 68)" />
    <rect x="55" y="52" width="10" height="34" rx="5" fill="#FFFFFF" />
    <line x1="60" y1="52" x2="60" y2="44" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <g transform="translate(60, 30)">
      <path d="M 0 -18 Q 1.5 -3.5 13 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -13 0 Q -1.5 -3.5 0 -18 Z" fill="url(#c2LockFlame)" />
      <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(95, 52)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#0EA5E9" font-weight="800">2</tspan>
      <tspan fill="url(#c2LockWish)">Wish</tspan>
    </text>
    
    <text x="2" y="20" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.8" 
          fill="#94A3B8" 
          text-transform="uppercase">CELEBRATE EVERY MOMENT</text>
  </g>
</svg>

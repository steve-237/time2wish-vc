<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="gShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid Bold Medallion Base -->
  <circle cx="60" cy="60" r="50" fill="url(#gBadge)" filter="url(#gShadow)" />

  <!-- Warm Golden Outer Rim (Subtle Luxury Distinction) -->
  <circle cx="60" cy="60" r="47.5" fill="none" stroke="url(#goldRim)" stroke-width="2" opacity="0.65" />

  <!-- Negative Space Hour Ticks -->
  <g fill="#FFFFFF">
    <rect x="58" y="15" width="4" height="9" rx="2" />
    <rect x="96" y="58" width="9" height="4" rx="2" />
    <rect x="58" y="96" width="4" height="9" rx="2" />
    <rect x="15" y="58" width="9" height="4" rx="2" />
  </g>

  <!-- Negative Space Candle & 2h Hand -->
  <g fill="#FFFFFF">
    <rect x="54" y="52" width="12" height="36" rx="6" />
    <path d="M 58 56 L 81 36 C 83 34, 86 36, 85 38 L 64 63 Z" />
    <circle cx="60" cy="58" r="4.5" fill="#0EA5E9" />
    <circle cx="60" cy="58" r="1.8" fill="#FEF08A" />
  </g>

  <!-- Rich Dual-Layer Candle Flame -->
  <path d="M 60 22 C 51 32, 52 46, 60 46 C 68 46, 69 32, 60 22 Z" fill="url(#gFlame)" />
  <circle cx="60" cy="38" r="3" fill="#FFFFFF" />

  <!-- 2 O'Clock Golden Wish Spark -->
  <g transform="translate(86, 30)">
    <path d="M 0 -17 Q 1.8 -3.5 13 0 Q 1.8 3.5 0 17 Q -1.8 3.5 -13 0 Q -1.8 -3.5 0 -17 Z" fill="url(#goldRim)" />
    <path d="M 0 -7 Q 0.8 -1.5 6 0 Q 0.8 1.5 0 7 Q -0.8 1.5 -6 0 Q -0.8 -1.5 0 -7 Z" fill="#FFFFFF" transform="rotate(45)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Twilight Gradient -->
    <radialGradient id="twilightDial" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- Master Medallion Rim Gradient (Platinum & Electric Cyan) -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Chamfer Specular Highlight -->
    <linearGradient id="specularRim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#BAE6FD" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Flame Gradients (Warm Solar Core) -->
    <linearGradient id="flameBody" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="25%" stop-color="#F97316" />
      <stop offset="65%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <radialGradient id="flameCore" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="flameAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow & Flare -->
    <linearGradient id="starFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="luxeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="medallionDrop" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Master Medallion Outer Chassis -->
  <g filter="url(#medallionDrop)">
    <!-- Base Outer Disc -->
    <circle cx="60" cy="60" r="50" fill="url(#twilightDial)" />
    <!-- Gradient Bezel Border -->
    <circle cx="60" cy="60" r="49" fill="none" stroke="url(#bezelGrad)" stroke-width="2.2" />
    <!-- Specular Highlight Top Edge -->
    <circle cx="60" cy="60" r="48" fill="none" stroke="url(#specularRim)" stroke-width="1.2" />
  </g>

  <!-- 2. Subtle Precision Horology Dial Track (Ticks & Orbital Ring) -->
  <circle cx="60" cy="60" r="43" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="1.5 5" opacity="0.35" />

  <!-- Cardinal Hour Markers (Polished Platinum Batons) -->
  <g fill="#F8FAFC" opacity="0.9">
    <!-- 12h Baton -->
    <path d="M 59 17 L 61 17 L 61.5 24 L 58.5 24 Z" />
    <!-- 3h Baton -->
    <path d="M 103 59 L 103 61 L 96 61.5 L 96 58.5 Z" />
    <!-- 6h Baton -->
    <path d="M 59 103 L 61 103 L 61.5 96 L 58.5 96 Z" />
    <!-- 9h Baton -->
    <path d="M 17 59 L 17 61 L 24 61.5 L 24 58.5 Z" />
  </g>

  <!-- Precision Starlet Markers at 1h, 4h, 5h, 7h, 8h, 10h, 11h -->
  <g fill="#94A3B8" opacity="0.4">
    <circle cx="82" cy="28" r="1.3" />
    <circle cx="94" cy="42" r="1.3" />
    <circle cx="94" cy="78" r="1.3" />
    <circle cx="82" cy="92" r="1.3" />
    <circle cx="38" cy="92" r="1.3" />
    <circle cx="26" cy="78" r="1.3" />
    <circle cx="26" cy="42" r="1.3" />
    <circle cx="38" cy="28" r="1.3" />
  </g>

  <!-- 3. Upper Sapphire Curved Glass Sheen -->
  <path d="M 24 45 C 32 24, 46 17, 60 17 C 74 17, 88 24, 96 45 C 82 31, 68 25, 60 25 C 52 25, 38 31, 24 45 Z" 
        fill="#FFFFFF" opacity="0.1" />

  <!-- 4. Negative Space Sculpture: The Candle & Dauphine Clock Hand -->
  <g id="sculpture">
    <!-- Soft Glow Silhouette underneath -->
    <ellipse cx="60" cy="70" rx="14" ry="24" fill="#38BDF8" opacity="0.12" filter="url(#luxeGlow)" />

    <!-- Candle Wax Column (Sculptural & Seamless with organic melted rim) -->
    <path d="M 53 58
             C 53 52, 57 51, 60 51
             C 63 51, 67 52, 67 58
             L 67 87
             C 67 91, 64 94, 60 94
             C 56 94, 53 91, 53 87
             Z" 
          fill="#FFFFFF" />

    <!-- Pure Dauphine Faceted Hand to 2 o'clock (Time2Wish) -->
    <!-- Light Facet (Top half catching light) -->
    <path d="M 60 58 
             L 86 38 
             C 87.5 37, 88.5 38.5, 87 39.5
             L 62 62 Z" 
          fill="#FFFFFF" />
    <!-- Shaded Facet (Subtle silver/ice blue bevel for luxury depth) -->
    <path d="M 60 58 
             L 87 39.5
             L 61 63
             C 60 62, 59.5 60, 60 58 Z" 
          fill="#E2E8F0" />

    <!-- Central Horology Hub (Watchmaker Cap) -->
    <circle cx="60" cy="58" r="5" fill="#0EA5E9" />
    <circle cx="60" cy="58" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    <circle cx="60" cy="58" r="2" fill="#FFFFFF" />
  </g>

  <!-- 5. Ethereal Candle Flame (Living Light) -->
  <!-- Warm Outer Aura -->
  <ellipse cx="60" cy="34" rx="18" ry="20" fill="url(#flameAura)" />

  <!-- Sculpted S-curve Flickering Teardrop Flame -->
  <path d="M 60 17
           C 57 23, 49 32, 50 40
           C 51 46, 56 49, 60 49
           C 64 49, 69 46, 70 40
           C 71 32, 63 23, 60 17 Z"
        fill="url(#flameBody)" />

  <!-- Inner Incandescent White-Solar Flame Core -->
  <path d="M 60 25
           C 58 29, 54 35, 55 41
           C 56 45, 58 46.5, 60 46.5
           C 62 46.5, 64 45, 65 41
           C 66 35, 62 29, 60 25 Z"
        fill="url(#flameCore)" />

  <!-- Sparklet Tip -->
  <circle cx="60" cy="18" r="1.5" fill="#FFFFFF" opacity="0.9" />

  <!-- 6. The Celestial AI Wish Spark at 2 O'Clock (Point of Arrival) -->
  <g transform="translate(89, 36)" filter="url(#luxeGlow)">
    <!-- Radiant Diamond Core -->
    <path d="M 0 -13 Q 1.5 -2.5 10 0 Q 1.5 2.5 0 13 Q -1.5 2.5 -10 0 Q -1.5 -2.5 0 -13 Z" 
          fill="url(#starFacet)" />

    <!-- 45-degree Brilliant Micro-Spur -->
    <path d="M 0 -5.5 Q 0.6 -1 4.5 0 Q 0.6 1 0 5.5 Q -0.6 1 -4.5 0 Q -0.6 -1 0 -5.5 Z" 
          fill="#FFFFFF" transform="rotate(45)" opacity="0.95" />

    <!-- Diamond Light Epicenter -->
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />

    <!-- Orbiting Golden Stardust Nodes -->
    <circle cx="9" cy="-5" r="1.2" fill="#FEF08A" opacity="0.8" />
    <circle cx="-6" cy="-7" r="0.9" fill="#FBBF24" opacity="0.7" />
    <circle cx="7" cy="7" r="0.8" fill="#FFFFFF" opacity="0.75" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded base -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#favBg)" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Dial -->
  <circle cx="30" cy="33" r="16" fill="#161F33" stroke="url(#favRing)" stroke-width="2" />
  
  <!-- Hour and minute hands pointing to 2 o'clock -->
  <line x1="30" y1="33" x2="30" y2="23" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="33" x2="38" y2="25" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <circle cx="30" cy="33" r="2" fill="#FEF08A" />

  <!-- Sweeping orbit -->
  <ellipse cx="30" cy="33" rx="22" ry="10" fill="none" stroke="#818CF8" stroke-width="1.8" transform="rotate(-28, 30, 33)" />

  <!-- 4-point wish star at 2 o'clock -->
  <path d="M 46 11 Q 47 16 52 17 Q 47 18 46 23 Q 45 18 40 17 Q 45 16 46 11 Z" fill="url(#favStar)" />
  <circle cx="46" cy="17" r="1" fill="#FFFFFF" />
</svg>

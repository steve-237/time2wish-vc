<div class="tm-modal-overlay" (click)="onCancel()">
  <div class="tm-modal-content" style="max-width: 600px; padding: 24px;" (click)="$event.stopPropagation()">
    <!-- Added a specific header with close button to top -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 style="margin: 0;">{{ t9n.t(isEditMode() ? 'form.title_edit' : 'form.title_add') }}</h1>
      <button class="icon-btn" (click)="onCancel()" style="background: none; border: none; cursor: pointer;">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

<div class="form-wrapper">
  

  <div class="form-card">
    
    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="alert-box">
      <span class="material-symbols-outlined">warning</span>
      <span class="alert-text">{{ errorMessage() }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="birthday-form-element">
      
      <!-- Name -->
      <div class="floating-group">
        <input 
          type="text" 
          id="b-name" 
          class="floating-input" 
          [ngModel]="name()" 
          (ngModelChange)="name.set($event)"
          name="name" 
          placeholder=" " 
          required>
        <label class="floating-label" for="b-name">{{ t9n.t('form.name') }}</label>
      </div>

      <div class="form-row">
        <!-- Birthdate -->
        <div class="floating-group" style="flex: 1; min-width: 200px;">
          <input 
            type="date" 
            id="b-date" 
            class="floating-input" 
            [ngModel]="birthdate()" 
            (ngModelChange)="birthdate.set($event)"
            name="birthdate" 
            required>
          <label class="floating-label" style="top: 4px; font-size: 0.7rem;" for="b-date">{{ t9n.t('form.birthdate') }}</label>
        </div>

        <!-- Photo (Optional) -->
        <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;">
          <label class="form-section-title" style="margin-bottom: 2px; font-size: 0.8rem;">{{ t9n.t('form.photo_url') }}</label>
          <app-image-upload [currentImageUrl]="photoUrl()" (imageUrlChange)="photoUrl.set($event)"></app-image-upload>
        </div>
      </div>

      <!-- Category Selection Cards -->
      <div class="category-cards-group">
        <label class="form-section-title">{{ t9n.t('form.category') }}</label>
        <div class="category-cards-grid">
          <button 
            type="button"
            *ngFor="let cat of categories" 
            (click)="category.set(cat)"
            [class.active]="category() === cat"
            [class]="'category-card card-' + cat.toLowerCase()">
            <span class="material-symbols-outlined cat-card-icon">{{ getIconForCategory(cat) }}</span>
            <span class="cat-card-label">{{ cat }}</span>
          </button>
        </div>
      </div>

      <div class="form-row" style="margin-top: 24px;">
        <!-- Reminder Days -->
        <div class="floating-group" style="flex: 1; min-width: 200px;">
          <div class="month-selector-custom" style="width: 100%;">
            <select 
              id="b-reminders" 
              class="custom-select-control" 
              [ngModel]="reminderDays()" 
              (ngModelChange)="reminderDays.set(+$event)"
              name="reminderDays">
              <option [value]="0">{{ t9n.t('form.reminder_0') }}</option>
              <option [value]="1">{{ t9n.t('form.reminder_1') }}</option>
              <option [value]="3">{{ t9n.t('form.reminder_3') }}</option>
              <option [value]="7">{{ t9n.t('form.reminder_7') }}</option>
              <option [value]="14">{{ t9n.t('form.reminder_14') }}</option>
            </select>
            <span class="material-symbols-outlined select-chevron">expand_more</span>
          </div>
          <label class="floating-label" style="top: 4px; font-size: 0.7rem;" for="b-reminders">{{ t9n.t('form.reminder_days') }}</label>
        </div>
      </div>

      <!-- Show Age Toggle -->
      <div class="toggle-group" style="margin-top: 20px;">
        <label class="form-section-title" style="margin-bottom: 8px; display: block;">
          {{ t9n.t('form.age_display') || 'Affichage de l\'âge' }}
        </label>
        <label class="toggle-switch">
          <input 
            type="checkbox" 
            [ngModel]="showAge()" 
            (ngModelChange)="showAge.set($event)"
            name="showAge">
          <span class="toggle-slider"></span>
          <span class="toggle-label">
            {{ showAge() 
              ? (t9n.t('form.age_visible') || 'Âge visible sur les cartes') 
              : (t9n.t('form.age_hidden') || 'Âge masqué') }}
          </span>
        </label>
      </div>

      <!-- Contact Info (Email & WhatsApp) -->
      <div style="margin-top: 20px;">
        <label class="form-section-title" style="margin-bottom: 12px; display: block;">
          <span class="material-symbols-outlined" style="font-size: 1rem; vertical-align: middle; margin-right: 4px;">contact_mail</span>
          {{ t9n.t('form.contact_info') || 'Coordonnées (optionnel)' }}
        </label>
        <div class="form-row">
          <!-- Email -->
          <div class="floating-group" style="flex: 1; min-width: 200px;">
            <input 
              type="email" 
              id="b-email" 
              class="floating-input" 
              [ngModel]="email()" 
              (ngModelChange)="email.set($event)"
              name="email" 
              placeholder=" ">
            <label class="floating-label" for="b-email">Email</label>
          </div>

          <!-- WhatsApp -->
          <div class="floating-group" style="flex: 1; min-width: 200px;">
            <input 
              type="tel" 
              id="b-whatsapp" 
              class="floating-input" 
              [ngModel]="whatsapp()" 
              (ngModelChange)="whatsapp.set($event)"
              name="whatsapp" 
              placeholder=" ">
            <label class="floating-label" for="b-whatsapp">WhatsApp</label>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="floating-group">
        <textarea 
          id="b-notes" 
          class="floating-input" 
          rows="4"
          [ngModel]="notes()" 
          (ngModelChange)="notes.set($event)"
          name="notes" 
          placeholder=" "></textarea>
        <label class="floating-label" for="b-notes">{{ t9n.t('form.notes') }}</label>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <a (click)="onCancel()" style="cursor: pointer;" class="btn-secondary">{{ t9n.t('form.btn_cancel') }}</a>
        <button type="submit" class="btn-premium">
          <span class="material-symbols-outlined">save</span>
          {{ isEditMode() ? t9n.t('form.btn_update') : t9n.t('form.btn_save') }}
        </button>
      </div>

    </form>

  </div>
</div>
  </div>
</div>

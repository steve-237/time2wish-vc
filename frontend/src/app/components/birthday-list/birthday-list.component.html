<div class="glass-card mat-elevation-z8 list-container">
  
  <table mat-table [dataSource]="dataSource" matSort class="birthday-table">

    <!-- Avatar Column -->
    <ng-container matColumnDef="avatar">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="avatar-container" [class]="birthdayService.getUrgencyClass(birthdayService.getDaysUntil(element.birthdate))" style="width: 40px; height: 40px; min-width: 40px;">
            <img [src]="element.photoUrl" alt="{{ element.name }}" class="birthday-avatar" style="width: 100%; height: 100%; border-radius: 50%;">
          </div>
          <button 
            (click)="toggleFavorite(element, $event)" 
            style="background: none; border: none; cursor: pointer; color: #fbbf24; padding: 0;"
            [title]="element.isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris'">
            <span class="material-symbols-outlined" [style.font-variation-settings]="element.isFavorite ? '&quot;FILL&quot; 1' : '&quot;FILL&quot; 0'" style="font-size: 1.4rem; transition: font-variation-settings 0.2s;">star</span>
          </button>
        </div>
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom </th>
      <td mat-cell *matCellDef="let element" class="fw-bold"> 
        {{element.name}}
        <span *ngIf="element.gender === 'Masculin'" class="material-symbols-outlined" style="color: #3b82f6; font-size: 1.1rem; vertical-align: middle; margin-left: 2px;" title="Masculin">male</span>
        <span *ngIf="element.gender === 'Féminin'" class="material-symbols-outlined" style="color: #ec4899; font-size: 1.1rem; vertical-align: middle; margin-left: 2px;" title="Féminin">female</span>
        <span *ngIf="element.gender === 'Autre'" class="material-symbols-outlined" style="color: #8b5cf6; font-size: 1.1rem; vertical-align: middle; margin-left: 2px;" title="Autre">transgender</span>
      </td>
    </ng-container>

    <!-- Birthdate Column -->
    <ng-container matColumnDef="birthdate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
      <td mat-cell *matCellDef="let element"> 
        <span class="flex-center gap-sm" style="justify-content: flex-start;">
          <span class="material-symbols-outlined icon-sm">event</span>
          {{element.birthdate | date:'dd MMMM yyyy'}} 
          <span [title]="getZodiac(element.birthdate).name" style="cursor:help; font-size: 1.1em;">{{ getZodiac(element.birthdate).emoji }}</span>
        </span>
      </td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Catégorie </th>
      <td mat-cell *matCellDef="let element"> 
        <span class="tag-category" [class]="'tag-' + element.category.toLowerCase()">{{ element.category }}</span>
      </td>
    </ng-container>

    <!-- Countdown Column -->
    <ng-container matColumnDef="countdown">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Statut </th>
      <td mat-cell *matCellDef="let element">
        <span 
          class="badge-urgency" 
          [class]="birthdayService.getUrgencyClass(birthdayService.getDaysUntil(element.birthdate))">
          <span class="material-symbols-outlined icon-sm">alarm</span>
          {{ getLabel(birthdayService.getCountdownLabel(birthdayService.getDaysUntil(element.birthdate))) }}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <div class="flex-center gap-sm" style="justify-content: flex-start;">
          <button 
            *ngIf="birthdayService.getDaysUntil(element.birthdate) === 0" 
            (click)="onSendWish(element, $event)" 
            class="btn-premium quick-wish-btn" 
            style="padding: 4px 8px; font-size: 0.75rem; border-radius: 8px;">
            <span class="material-symbols-outlined icon-sm">send</span>
          </button>
          
          <a [routerLink]="['/dashboard/birthday/edit', element.id]" (click)="$event.stopPropagation()" class="action-icon-link" [title]="t9n.t('detail.btn_edit') || 'Modifier'">
            <span class="material-symbols-outlined">edit</span>
          </a>
          <button (click)="onDelete(element.id, $event)" class="action-icon-btn" [title]="t9n.t('detail.btn_delete') || 'Supprimer'">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [routerLink]="['/dashboard/birthday', row.id]" class="table-row-hover"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of birthdays"></mat-paginator>

</div>

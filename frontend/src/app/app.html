<!-- Glassmorphic Header -->
<header class="glass-header" *ngIf="authService.isAuthenticated()">
  <div class="header-content flex-between gap-md">
    
    <!-- Logo -->
    <a routerLink="/dashboard" class="logo-link flex-center gap-sm">
      <span class="gradient-text">Time2Wish</span>
      <span>🎂</span>
    </a>



    <!-- Toolbar actions -->
    <div class="toolbar-actions flex-center gap-sm">
      
      <!-- Language Selector Custom Dropdown -->
      <div class="custom-lang-menu-container" style="position: relative;">
        <button class="custom-lang-btn" (click)="isLangMenuOpen.set(!isLangMenuOpen())" style="display: flex; align-items: center; gap: 4px; border-radius: 20px; padding: 4px 12px; font-size: 1.2rem;">
          <img [src]="getActiveFlagUrl()" alt="flag" class="flag-icon" style="border-radius: 2px;">
          <span class="material-symbols-outlined" style="font-size: 1.2rem; transition: transform 0.2s;" [style.transform]="isLangMenuOpen() ? 'rotate(180deg)' : 'rotate(0)'">expand_more</span>
        </button>

        <div class="custom-lang-dropdown" *ngIf="isLangMenuOpen()">
          <div class="lang-option" *ngFor="let lang of languages" (click)="setLanguage(lang.code)" [class.active]="t9n.currentLang() === lang.code">
            <img [src]="lang.flagUrl" alt="flag" class="flag-icon">
            <span class="label">{{ lang.label }}</span>
          </div>
        </div>
      </div>

      <!-- Backdrop to close the menu when clicking outside -->
      <div *ngIf="isLangMenuOpen()" (click)="isLangMenuOpen.set(false)" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 90;"></div>

      <!-- Install PWA Button -->
      <button *ngIf="pwaService.canInstall()" (click)="pwaService.installApp()" class="btn-premium" style="padding: 6px 12px; font-size: 0.85rem; height: 36px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; margin-right: 4px;">install_desktop</span>
        <span class="hide-mobile">{{ t9n.t('nav.install') || 'Installer' }}</span>
      </button>

      <!-- App mode switch -->
      <button (click)="cycleAppMode()" class="icon-btn theme-toggle" [title]="appMode() === 'light' ? 'Mode Sombre' : (appMode() === 'dark' ? 'Mode OLED' : 'Mode Clair')">
        <span class="material-symbols-outlined" *ngIf="appMode() === 'light'">dark_mode</span>
        <span class="material-symbols-outlined" *ngIf="appMode() === 'dark'">contrast</span>
        <span class="material-symbols-outlined" *ngIf="appMode() === 'oled'">light_mode</span>
      </button>

      <!-- Notifications Panel -->
      <app-notification-panel></app-notification-panel>

      <!-- Profile dropdown / User Menu -->
      <a routerLink="/dashboard/profile" class="user-profile-menu flex-center gap-sm" style="text-decoration: none; cursor: pointer; padding: 6px; border-radius: 12px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
        <img [src]="authService.currentUser()?.avatarUrl" alt="Avatar" class="user-avatar">
        <div class="user-info">
          <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
          <span class="user-email">{{ authService.currentUser()?.email }}</span>
        </div>
      </a>

      <!-- Logout -->
      <button (click)="onLogout()" class="btn-secondary logout-btn">
        <span class="material-symbols-outlined logout-icon">logout</span>
        <span class="logout-text">{{ t9n.t('nav.logout') }}</span>
      </button>
    </div>

  </div>
</header>

<!-- Main content routing window -->
<main class="main-container">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="app-footer">
  <div class="footer-content flex-center">
    <p>© 2026 Time2Wish. {{ t9n.t('footer.tagline') }}</p>
    <div class="footer-links flex-center gap-md">
      <a href="#" class="footer-link">{{ t9n.t('footer.privacy') }}</a>
      <span class="separator">•</span>
      <a href="#" class="footer-link">{{ t9n.t('footer.terms') }}</a>
      <span class="separator">•</span>
      <a href="#" class="footer-link">{{ t9n.t('footer.support') }}</a>
    </div>
  </div>
</footer>

<!-- Floating Toasts -->
<app-toast-container></app-toast-container>

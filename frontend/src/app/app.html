<!-- Glassmorphic Header -->
<header class="glass-header" *ngIf="authService.isAuthenticated()">
  <div class="header-content flex-between gap-md">
    
    <!-- Logo -->
    <a routerLink="/dashboard" class="logo-link flex-center gap-sm">
      <span class="gradient-text">Time2Wish</span>
      <span>🎂</span>
    </a>


    <!-- Toolbar actions -->
    <div class="toolbar-actions flex-center gap-sm">
      
      <!-- Language Selector -->
      <div class="lang-selector month-selector-custom" style="position: relative; min-width: 140px;">
        <select class="custom-select-control" [value]="t9n.currentLang()" (change)="setLanguage($any($event.target).value)">
          <option *ngFor="let lang of languages" [value]="lang.code">
            {{ lang.flag }} {{ lang.label }}
          </option>
        </select>
        <span class="material-symbols-outlined select-chevron">expand_more</span>
      </div>

      <!-- Dark mode switch -->
      <button (click)="toggleDarkMode()" class="icon-btn theme-toggle" [title]="isDarkMode() ? (t9n.t('nav.light_mode') || 'Passer au mode clair') : (t9n.t('nav.dark_mode') || 'Passer au mode sombre')">
        <span class="material-symbols-outlined" *ngIf="!isDarkMode()">dark_mode</span>
        <span class="material-symbols-outlined" *ngIf="isDarkMode()">light_mode</span>
      </button>

      <!-- Notifications Panel -->
      <app-notification-panel></app-notification-panel>

      <!-- User avatar & Profile menu -->
      <a routerLink="/profile" class="user-profile-menu flex-center gap-sm" style="text-decoration: none; cursor: pointer; padding: 6px; border-radius: 12px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
        <img [src]="authService.currentUser()?.avatarUrl" alt="Avatar" class="user-avatar">
        <div class="user-info">
          <span class="user-name">{{ authService.currentUser()?.fullName }}</span>
          <span class="user-email">{{ authService.currentUser()?.email }}</span>
        </div>
      </a>

      <!-- Logout -->
      <button (click)="onLogout()" class="btn-secondary logout-btn">
        <span class="material-symbols-outlined logout-icon">logout</span>
        <span class="logout-text">{{ t9n.t('nav.logout') }}</span>
      </button>
    </div>

  </div>
</header>

<!-- Main content routing window -->
<main class="main-container">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="app-footer">
  <div class="footer-content flex-center">
    <p>© 2026 Time2Wish. {{ t9n.t('footer.tagline') }}</p>
    <div class="footer-links flex-center gap-md">
      <a href="#" class="footer-link">{{ t9n.t('footer.privacy') }}</a>
      <span class="separator">•</span>
      <a href="#" class="footer-link">{{ t9n.t('footer.terms') }}</a>
      <span class="separator">•</span>
      <a href="#" class="footer-link">{{ t9n.t('footer.support') }}</a>
    </div>
  </div>
</footer>

<!-- Floating Toasts -->
<app-toast-container></app-toast-container>

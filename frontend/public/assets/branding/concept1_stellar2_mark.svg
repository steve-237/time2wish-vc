<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="c1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="c1Star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="c1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Orbit Ring (Time) -->
  <circle cx="60" cy="60" r="46" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="1.8" 
          stroke-dasharray="4 8" 
          opacity="0.35" />

  <!-- Monoline '2' (Time to Wish) -->
  <path d="M 40 38 
           C 40 22, 54 16, 66 16 
           C 80 16, 88 26, 88 38 
           C 88 52, 78 66, 60 80 
           L 38 94 
           L 88 94" 
        fill="none" 
        stroke="url(#c1Grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- The AI Wish Spark crowning the '2' at 2 o'clock -->
  <g transform="translate(88, 20)" filter="url(#c1Glow)">
    <path d="M 0 -16 Q 1.5 -3.5 13 0 Q 1.5 3.5 0 16 Q -1.5 3.5 -13 0 Q -1.5 -3.5 0 -16 Z" 
          fill="url(#c1Star)" />
    <!-- Secondary Flare -->
    <path d="M 0 -7 Q 0.8 -1.5 6 0 Q 0.8 1.5 0 7 Q -0.8 1.5 -6 0 Q -0.8 -1.5 0 -7 Z" 
          fill="#FFFFFF" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>

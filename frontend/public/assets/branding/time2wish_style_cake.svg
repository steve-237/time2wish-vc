<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cakeBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="cakeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cakeIcing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cakeFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="cakeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Celebration Confetti Dots in Background -->
  <circle cx="22" cy="34" r="3" fill="#F43F5E" />
  <circle cx="98" cy="36" r="3.5" fill="#38BDF8" />
  <circle cx="28" cy="18" r="2" fill="#FEF08A" />
  <circle cx="92" cy="18" r="2.5" fill="#F59E0B" />

  <!-- Bottom Tier Base -->
  <rect x="24" y="66" width="72" height="32" rx="10" 
        fill="url(#cakeBase)" filter="url(#cakeShadow)" />
        
  <!-- Bottom Tier Icing Drips -->
  <path d="M 24 74 
           C 28 80, 34 80, 38 74 
           C 42 80, 48 80, 52 74 
           C 56 80, 64 80, 68 74 
           C 72 80, 78 80, 82 74 
           C 86 80, 92 80, 96 74 
           L 96 66 L 24 66 Z" 
        fill="url(#cakeIcing)" />

  <!-- Top Tier Base -->
  <rect x="36" y="44" width="48" height="26" rx="8" 
        fill="url(#cakeTop)" filter="url(#cakeShadow)" />
        
  <!-- Top Tier Icing Drips -->
  <path d="M 36 50 
           C 40 54, 44 54, 48 50 
           C 52 54, 56 54, 60 50 
           C 64 54, 68 54, 72 50 
           C 76 54, 80 54, 84 50 
           L 84 44 L 36 44 Z" 
        fill="#FFFFFF" opacity="0.9" />

  <!-- 2 Birthday Candles on Top (Time '2' Wish) -->
  <!-- Candle 1 (Left) -->
  <rect x="47" y="28" width="6" height="16" rx="3" fill="#FFFFFF" />
  <line x1="50" y1="28" x2="50" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <g transform="translate(50, 16)">
    <path d="M 0 -10 Q 1 -2 7 0 Q 1 2 0 10 Q -1 2 -7 0 Q -1 -2 0 -10 Z" fill="url(#cakeFlame)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Candle 2 (Right) -->
  <rect x="67" y="28" width="6" height="16" rx="3" fill="#FFFFFF" />
  <line x1="70" y1="28" x2="70" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <g transform="translate(70, 16)">
    <path d="M 0 -10 Q 1 -2 7 0 Q 1 2 0 10 Q -1 2 -7 0 Q -1 -2 0 -10 Z" fill="url(#cakeFlame)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>
</svg>

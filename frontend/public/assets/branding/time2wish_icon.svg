<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
    </linearGradient>

    <!-- Clock Ring Gradients -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="1" />
    </linearGradient>

    <!-- Star Glow & Gradients -->
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientCyan" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with App Icon Curvature -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#squircleBorder)" stroke-width="2.5" />

  <!-- Ambient Internal Lights -->
  <circle cx="160" cy="160" r="180" fill="url(#ambientCyan)" />
  <circle cx="350" cy="350" r="180" fill="url(#ambientPurple)" />

  <!-- Top Glass Highlight Overlay -->
  <path d="M 24 128 C 24 64, 64 24, 128 24 L 384 24 C 448 24, 488 64, 488 128 C 440 180, 320 220, 240 220 C 130 220, 50 170, 24 128 Z"
        fill="white" opacity="0.04" />

  <!-- Central Clock Dial Surface -->
  <g transform="translate(256, 260)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.4" />
    
    <!-- Dial Glass Body -->
    <circle cx="0" cy="0" r="140" fill="url(#dialGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />
    
    <!-- Inner Subtle Dial Ring -->
    <circle cx="0" cy="0" r="122" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.7" />

    <!-- Clock Hour Markers -->
    <!-- 12 o'clock -->
    <rect x="-2" y="-128" width="4" height="14" rx="2" fill="#38BDF8" opacity="0.9" />
    <!-- 3 o'clock -->
    <rect x="114" y="-2" width="14" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
    <!-- 6 o'clock -->
    <rect x="-2" y="114" width="4" height="14" rx="2" fill="#94A3B8" opacity="0.6" />
    <!-- 9 o'clock -->
    <rect x="-128" y="-2" width="14" height="4" rx="2" fill="#94A3B8" opacity="0.6" />

    <!-- 1, 2, 4, 5, 7, 8, 10, 11 o'clock dots -->
    <circle cx="56" cy="-97" r="3" fill="#94A3B8" opacity="0.4" />
    <!-- 2 o'clock marker highlighted -->
    <circle cx="97" cy="-56" r="4.5" fill="#F59E0B" filter="url(#neonGlow)" />
    <circle cx="97" cy="56" r="3" fill="#94A3B8" opacity="0.4" />
    <circle cx="56" cy="97" r="3" fill="#94A3B8" opacity="0.4" />
    <circle cx="-56" cy="97" r="3" fill="#94A3B8" opacity="0.4" />
    <circle cx="-97" cy="56" r="3" fill="#94A3B8" opacity="0.4" />
    <circle cx="-97" cy="-56" r="3" fill="#94A3B8" opacity="0.4" />
    <circle cx="-56" cy="-97" r="3" fill="#94A3B8" opacity="0.4" />

    <!-- Clock Hands: Elegantly pointing towards ~1:55 / 2:00 (Time to Wish) -->
    <!-- Hour Hand pointing to 1:55 / 2:00 -->
    <path d="M 0 6 L -3 0 L -1.5 -55 Q 0 -62 1.5 -55 L 3 0 Z" fill="#E2E8F0" />
    
    <!-- Minute Hand pointing right at 2 o'clock (toward Wish Star) -->
    <path d="M 0 8 L -2.5 0 L 52 -52 Q 57 -57 62 -52 L 2.5 4 Z" fill="url(#ringGrad)" />

    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
    <circle cx="0" cy="0" r="3" fill="#FEF08A" />
  </g>

  <!-- Sweeping Celestial Orbital Ring (Time -> Wish Flow) -->
  <ellipse cx="256" cy="260" rx="185" ry="92"
           fill="none" stroke="url(#orbitGrad)" stroke-width="4.5"
           transform="rotate(-28, 256, 260)"
           filter="url(#neonGlow)" />
           
  <!-- Secondary Fine Shimmer Orbit -->
  <ellipse cx="256" cy="260" rx="192" ry="76"
           fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="12 18"
           transform="rotate(32, 256, 260)"
           opacity="0.5" />

  <!-- The AI Wish Spark (At 2 O'Clock, Position approx x=362, y=148) -->
  <g transform="translate(366, 150)">
    <!-- Diffuse Golden Glow Field -->
    <circle cx="0" cy="0" r="70" fill="url(#goldGlow)" />
    
    <!-- Radiant 4-Pointed Star (Wish Spark) -->
    <path d="M 0 -48 Q 2 -12 12 -2 Q 48 0 12 2 Q 2 12 0 48 Q -2 12 -12 2 Q -48 0 -12 -2 Q -2 -12 0 -48 Z"
          fill="url(#starCore)"
          filter="url(#intenseGlow)" />

    <!-- Diagonal Secondary Starlet Flare -->
    <path d="M 0 -22 Q 1 -6 6 -1 Q 22 0 6 1 Q 1 6 0 22 Q -1 6 -6 1 Q -22 0 -6 -1 Q -1 -6 0 -22 Z"
          fill="#FFFFFF"
          transform="rotate(45)"
          opacity="0.9" />

    <!-- Super-bright Center Diamond Core -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />

    <!-- Micro Magic Dust Particles -->
    <circle cx="34" cy="-18" r="2.2" fill="#FDE047" opacity="0.8" />
    <circle cx="-28" cy="-30" r="1.8" fill="#FDE047" opacity="0.7" />
    <circle cx="26" cy="28" r="1.6" fill="#67E8F9" opacity="0.85" />
    <circle cx="44" cy="14" r="2" fill="#F59E0B" opacity="0.6" />
    <circle cx="-38" cy="18" r="1.5" fill="#C084FC" opacity="0.7" />
  </g>

  <!-- Subtle Bottom Ambient Rim Light -->
  <path d="M 112 488 C 190 500, 322 500, 400 488" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.4" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="v3Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="v3Right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="v3Flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="v3Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Semi-Circle (Electric Cyan) with Shadow -->
  <path d="M 60 10 A 50 50 0 0 0 60 110 Z" fill="url(#v3Left)" filter="url(#v3Shadow)" />

  <!-- Right Semi-Circle (Vivid Violet) -->
  <path d="M 60 10 A 50 50 0 0 1 60 110 Z" fill="url(#v3Right)" filter="url(#v3Shadow)" />

  <!-- Outer Rim Stroke -->
  <circle cx="60" cy="60" r="47" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.35" />

  <!-- Negative Space Cutout Candle Carved Down the Center Line -->
  <!-- Candle Body Cutout (Bold Crisp White) -->
  <rect x="52" y="50" width="16" height="38" rx="8" fill="#FFFFFF" />
  
  <!-- Candle Wick -->
  <line x1="60" y1="50" x2="60" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Sweeping Clock Dial Ticks (Negative Space) -->
  <circle cx="22" cy="60" r="3.5" fill="#FFFFFF" />
  <circle cx="98" cy="60" r="3.5" fill="#FFFFFF" />
  <circle cx="60" cy="98" r="3.5" fill="#FFFFFF" />

  <!-- Clock Hand reaching to 2 o'clock -->
  <path d="M 58 60 L 82 38 Q 85 35 88 38 L 62 64 Z" fill="#FFFFFF" />

  <!-- Candle Flame & AI Wish Spark (Center Stage, Radiant Amber/Gold) -->
  <g transform="translate(60, 26)">
    <path d="M 0 -17 Q 1.5 -3.5 12 0 Q 1.5 3.5 0 17 Q -1.5 3.5 -12 0 Q -1.5 -3.5 0 -17 Z" 
          fill="url(#v3Flame)" />
    <!-- White Hot Core -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- 2 O'Clock Highlight Star -->
  <circle cx="88" cy="34" r="3.5" fill="#FBBF24" />
</svg>

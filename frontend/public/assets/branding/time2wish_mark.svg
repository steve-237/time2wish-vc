<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clock Ring Gradients -->
    <linearGradient id="markDialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="markRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="markOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="1" />
    </linearGradient>

    <!-- Star Glow & Gradients -->
    <radialGradient id="markStarCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="markGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="markNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="markIntenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Central Clock Dial Surface -->
  <g transform="translate(195, 205)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="122" fill="none" stroke="url(#markRingGrad)" stroke-width="3.5" opacity="0.6" filter="url(#markNeonGlow)" />
    
    <!-- Dial Glass Body -->
    <circle cx="0" cy="0" r="115" fill="url(#markDialGrad)" stroke="url(#markRingGrad)" stroke-width="2" />
    
    <!-- Inner Subtle Dial Ring -->
    <circle cx="0" cy="0" r="98" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.8" />

    <!-- Clock Hour Markers -->
    <rect x="-2" y="-105" width="4" height="12" rx="2" fill="#38BDF8" opacity="0.9" />
    <rect x="93" y="-2" width="12" height="4" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="-2" y="93" width="4" height="12" rx="2" fill="#94A3B8" opacity="0.6" />
    <rect x="-105" y="-2" width="12" height="4" rx="2" fill="#94A3B8" opacity="0.6" />

    <!-- Sub-markers -->
    <circle cx="45" cy="-78" r="2.5" fill="#94A3B8" opacity="0.4" />
    <!-- 2 o'clock marker highlighted -->
    <circle cx="78" cy="-45" r="4" fill="#F59E0B" filter="url(#markNeonGlow)" />
    <circle cx="78" cy="45" r="2.5" fill="#94A3B8" opacity="0.4" />
    <circle cx="45" cy="78" r="2.5" fill="#94A3B8" opacity="0.4" />
    <circle cx="-45" cy="78" r="2.5" fill="#94A3B8" opacity="0.4" />
    <circle cx="-78" cy="45" r="2.5" fill="#94A3B8" opacity="0.4" />
    <circle cx="-78" cy="-45" r="2.5" fill="#94A3B8" opacity="0.4" />
    <circle cx="-45" cy="-78" r="2.5" fill="#94A3B8" opacity="0.4" />

    <!-- Clock Hands pointing to 2:00 -->
    <!-- Hour Hand -->
    <path d="M 0 5 L -2.5 0 L -1 -44 Q 0 -50 1 -44 L 2.5 0 Z" fill="#E2E8F0" />
    
    <!-- Minute Hand pointing right at 2 o'clock -->
    <path d="M 0 6 L -2 0 L 42 -42 Q 46 -46 50 -42 L 2 3 Z" fill="url(#markRingGrad)" filter="url(#markNeonGlow)" />

    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="7.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="2.5" fill="#FEF08A" />
  </g>

  <!-- Sweeping Celestial Orbital Ring -->
  <ellipse cx="195" cy="205" rx="150" ry="74"
           fill="none" stroke="url(#markOrbitGrad)" stroke-width="3.8"
           transform="rotate(-28, 195, 205)"
           filter="url(#markNeonGlow)" />
           
  <!-- Secondary Fine Shimmer Orbit -->
  <ellipse cx="195" cy="205" rx="155" ry="60"
           fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="10 14"
           transform="rotate(32, 195, 205)"
           opacity="0.45" />

  <!-- The AI Wish Spark (At 2 O'Clock, Position approx x=286, y=114) -->
  <g transform="translate(286, 114)">
    <!-- Diffuse Golden Glow Field -->
    <circle cx="0" cy="0" r="56" fill="url(#markGoldGlow)" />
    
    <!-- Radiant 4-Pointed Star (Wish Spark) -->
    <path d="M 0 -38 Q 1.5 -10 10 -1.5 Q 38 0 10 1.5 Q 1.5 10 0 38 Q -1.5 10 -10 1.5 Q -38 0 -10 -1.5 Q -1.5 -10 0 -38 Z"
          fill="url(#markStarCore)"
          filter="url(#markIntenseGlow)" />

    <!-- Diagonal Secondary Starlet Flare -->
    <path d="M 0 -17 Q 1 -5 5 -1 Q 17 0 5 1 Q 1 5 0 17 Q -1 5 -5 1 Q -17 0 -5 -1 Q -1 -5 0 -17 Z"
          fill="#FFFFFF"
          transform="rotate(45)"
          opacity="0.9" />

    <!-- Super-bright Center Diamond Core -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />

    <!-- Micro Magic Dust Particles -->
    <circle cx="26" cy="-14" r="1.8" fill="#FDE047" opacity="0.85" />
    <circle cx="-22" cy="-24" r="1.5" fill="#FDE047" opacity="0.75" />
    <circle cx="20" cy="22" r="1.4" fill="#67E8F9" opacity="0.9" />
    <circle cx="34" cy="11" r="1.6" fill="#F59E0B" opacity="0.7" />
  </g>
</svg>

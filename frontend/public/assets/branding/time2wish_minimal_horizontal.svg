<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%">
  <defs>
    <linearGradient id="hMinGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="hStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="hWishText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Left: Minimalist Icon Mark -->
  <g transform="translate(10, 8)">
    <!-- Clock Arc -->
    <path d="M 48 24 A 24 24 0 1 1 30 10" 
          fill="none" 
          stroke="url(#hMinGrad)" 
          stroke-width="3.6" 
          stroke-linecap="round" />

    <!-- Minimal Hands -->
    <line x1="34" y1="34" x2="34" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="34" y1="34" x2="45" y2="25" stroke="url(#hMinGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="34" cy="34" r="3" fill="#38BDF8" />

    <!-- 2 O'Clock Spark -->
    <g transform="translate(48, 14)">
      <path d="M 0 -10 Q 1 -2 8 0 Q 1 2 0 10 Q -1 2 -8 0 Q -1 -2 0 -10 Z" 
            fill="url(#hStarGrad)" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Minimalist Wordmark -->
  <g transform="translate(90, 52)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#0EA5E9" font-weight="800">2</tspan>
      <tspan fill="url(#hWishText)">Wish</tspan>
    </text>
  </g>
</svg>

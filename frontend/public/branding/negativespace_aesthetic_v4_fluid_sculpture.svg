<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant Master Gradient: Electric Cyan into Vivid Indigo & Royal Violet -->
    <linearGradient id="pureMedallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="28%" stop-color="#0EA5E9" />
      <stop offset="68%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Inner Ambient Glow Ring -->
    <linearGradient id="innerGlowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Solar Flame Gradient -->
    <linearGradient id="solarFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <radialGradient id="solarCore" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="solarHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- 2h Wish Star Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="cleanShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Medallion Body -->
  <g filter="url(#cleanShadow)">
    <circle cx="60" cy="60" r="50" fill="url(#pureMedallion)" />
    <!-- Ultra-Sleek Chamfer Bevel Ring -->
    <circle cx="60" cy="60" r="47.5" fill="none" stroke="url(#innerGlowRing)" stroke-width="1.2" />
  </g>

  <!-- 2. Minimalist Precision Dial Track (Fine Optical Dots at Hours) -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="60" cy="19" r="1.8" />
    <circle cx="101" cy="60" r="1.8" />
    <circle cx="60" cy="101" r="1.8" />
    <circle cx="19" cy="60" r="1.8" />
    <circle cx="80" cy="80" r="1.2" />
    <circle cx="40" cy="80" r="1.2" />
    <circle cx="40" cy="40" r="1.2" />
  </g>

  <!-- 3. Glass Curve Reflection -->
  <path d="M 22 47 C 28 25, 42 16, 60 16 C 78 16, 92 25, 98 47 C 84 33, 70 27, 60 27 C 50 27, 36 33, 22 47 Z" 
        fill="#FFFFFF" opacity="0.14" />

  <!-- 4. Negative Space Masterpiece: Pure Fluid Candle & 2h Hand -->
  <g fill="#FFFFFF">
    <!-- Candle Base: Perfectly Proportioned Pillar with Smooth Curved Top -->
    <path d="M 53.5 56
             C 53.5 51, 56.5 50, 60 50
             C 63.5 50, 66.5 51, 66.5 56
             L 66.5 87
             C 66.5 91, 63.5 94, 60 94
             C 56.5 94, 53.5 91, 53.5 87
             Z" />

    <!-- Sleek Aerodynamic Needle Hand pointing to 2 o'clock -->
    <path d="M 59 56
             L 85 36.5
             C 86.8 35.2, 88.2 36.8, 86.8 38.2
             L 63.5 61.5
             Z" />

    <!-- Center Pivot Jewel -->
    <circle cx="60" cy="57" r="4.6" fill="#0284C7" />
    <circle cx="60" cy="57" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- 5. Vibrant Incandescent Flame -->
  <!-- Ambient Corona -->
  <ellipse cx="60" cy="33" rx="16" ry="18" fill="url(#solarHalo)" />

  <!-- Outer Teardrop -->
  <path d="M 60 16
           C 51 28, 52 44, 60 44
           C 68 44, 69 28, 60 16 Z" 
        fill="url(#solarFlame)" />

  <!-- Inner Core -->
  <path d="M 60 24
           C 55 31, 56 39.5, 60 39.5
           C 64 39.5, 65 31, 60 24 Z" 
        fill="url(#solarCore)" />

  <!-- 6. Celestial Wish Spark at 2 O'Clock (Time2Wish) -->
  <g transform="translate(88, 33)" filter="url(#sparkGlow)">
    <!-- 4-point Diamond Spark -->
    <path d="M 0 -13 Q 1.5 -2.5 10 0 Q 1.5 2.5 0 13 Q -1.5 2.5 -10 0 Q -1.5 -2.5 0 -13 Z" 
          fill="url(#sparkGrad)" />

    <!-- Micro Cross Flare -->
    <path d="M 0 -5.5 Q 0.6 -1 4.5 0 Q 0.6 1 0 5.5 Q -0.6 1 -4.5 0 Q -0.6 -1 0 -5.5 Z" 
          fill="#FFFFFF" transform="rotate(45)" opacity="0.95" />

    <!-- Diamond Core -->
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />

    <!-- Delicate Satellite Stardust -->
    <circle cx="8" cy="-5" r="1.2" fill="#FEF08A" opacity="0.9" />
    <circle cx="-6" cy="-6" r="0.9" fill="#FBBF24" opacity="0.8" />
  </g>
</svg>

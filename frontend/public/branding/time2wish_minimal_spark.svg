<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="minGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Clock Arc (Open at 2 o'clock) -->
  <path d="M 88 42 A 42 42 0 1 1 54 18" 
        fill="none" 
        stroke="url(#minGrad1)" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Minimal Clock Hands pointing to 2 o'clock (Time to Wish) -->
  <!-- Hour hand -->
  <line x1="60" y1="60" x2="60" y2="34" 
        stroke="#E2E8F0" 
        stroke-width="4.5" 
        stroke-linecap="round" />
        
  <!-- Minute hand pointing toward the star -->
  <line x1="60" y1="60" x2="80" y2="44" 
        stroke="url(#minGrad1)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Center Pivot -->
  <circle cx="60" cy="60" r="4.5" fill="#38BDF8" />

  <!-- The Minimalist Wish Star at 2 o'clock -->
  <g transform="translate(86, 26)">
    <!-- 4-pointed sharp star -->
    <path d="M 0 -18 Q 1.5 -3.5 14 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -14 0 Q -1.5 -3.5 0 -18 Z" 
          fill="url(#starGrad1)" />
    <!-- Bright center core -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
</svg>

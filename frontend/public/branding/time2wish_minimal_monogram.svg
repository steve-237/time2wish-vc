<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="monoWGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- Minimal Orbit Ring (Time) -->
  <ellipse cx="60" cy="62" rx="46" ry="18" 
           fill="none" 
           stroke="#38BDF8" 
           stroke-width="2.5" 
           stroke-dasharray="8 6" 
           opacity="0.4"
           transform="rotate(-20, 60, 62)" />

  <!-- Geometric 'W' (Wish) with modern curvature -->
  <path d="M 24 46 
           C 28 76, 36 90, 44 90 
           C 52 90, 56 68, 60 54 
           C 64 68, 68 90, 76 90 
           C 84 90, 92 76, 96 46" 
        fill="none" 
        stroke="url(#monoWGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Candle Flame / AI Spark (Celebration & Wishes) -->
  <g transform="translate(60, 28)">
    <!-- 4-point star flame -->
    <path d="M 0 -14 Q 1.5 -3 10 0 Q 1.5 3 0 14 Q -1.5 3 -10 0 Q -1.5 -3 0 -14 Z" 
          fill="url(#flameGrad)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>

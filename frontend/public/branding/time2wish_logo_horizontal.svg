<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <!-- Left Emblem (Flat, Light Interior) -->
  <g transform="translate(6, 0)">
    <!-- Watch Crown Button -->
    <rect x="57" y="4" width="6" height="5" rx="1.5" fill="#0EA5E9" />
    
    <!-- Outer Ring (Solid Electric Cyan) -->
    <circle cx="60" cy="60" r="50" fill="#0EA5E9" />
    
    <!-- Inner Pure White Dial Face -->
    <circle cx="60" cy="60" r="44" fill="#FFFFFF" />

    <!-- 4 Cardinal Ticks in Subtle Slate -->
    <g fill="#CBD5E1">
      <rect x="58.7" y="20" width="2.6" height="6.5" rx="1.3" />
      <rect x="93.5" y="58.7" width="6.5" height="2.6" rx="1.3" />
      <rect x="58.7" y="93.5" width="2.6" height="6.5" rx="1.3" />
      <rect x="20" y="58.7" width="6.5" height="2.6" rx="1.3" />
    </g>

    <!-- Candle Body & 2h Hand in Cyan Ciel -->
    <g id="lockupCandle">
      <path d="M 56 60 L 56 82 C 56 84.4, 57.8 86.4, 60 86.4 C 62.2 86.4, 64 84.4, 64 82 L 64 60 Z" fill="#0EA5E9" />
      <path d="M 58 57 L 78.5 45 C 79.8 44.2, 81.4 45.8, 80.6 47.3 L 62.5 62 Z" fill="#0EA5E9" />
      <circle cx="60" cy="60" r="7.5" fill="#0EA5E9" />
      <circle cx="60" cy="60" r="4" fill="#0284C7" />
      <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Flame in Coral & Sun Gold -->
    <path d="M 60 28.5 C 55 35.5, 52 42, 53.5 47.5 C 55 52, 57.4 54, 60 54 C 62.6 54, 65 52, 66.5 47.5 C 68 42, 65 35.5, 60 28.5 Z" fill="#F97316" />
    <path d="M 60 37 C 57.8 41, 56.8 45, 57.8 48 C 58.4 50.5, 59.2 51.5, 60 51.5 C 60.8 51.5, 61.6 50.5, 62.2 48 C 63.2 45, 62.2 41, 60 37 Z" fill="#FBBF24" />

    <!-- 2h AI Wish Spark -->
    <g transform="translate(85, 41.5)">
      <path d="M 0 -12 Q 1.1 -2.2 7 0 Q 1.1 2.2 0 12 Q -1.1 2.2 -7 0 Q -1.1 -2.2 0 -12 Z" fill="#F59E0B" />
      <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Side (Optimized for Light Backgrounds) -->
  <g transform="translate(136, 0)">
    <!-- Brand Title -->
    <text x="0" y="66" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#0F172A">Time</tspan>
      <tspan fill="#0EA5E9">2</tspan>
      <tspan fill="#8B5CF6">Wish</tspan>
    </text>

    <!-- Tagline -->
    <text x="3" y="88" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="2">
      L'ASSISTANT DES ANNIVERSAIRES &amp; CÉLÉBRATIONS
    </text>

    <!-- Micro AI Spark Accent -->
    <g transform="translate(390, 36)">
      <path d="M 0 -6 Q 0.8 -1.2 5 0 Q 0.8 1.2 0 6 Q -0.8 1.2 -5 0 Q -0.8 -1.2 0 -6 Z" fill="#F59E0B" />
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Master Outer Bezel Gradient (Electric Cyan -> Blue -> Indigo -> Purple) -->
    <linearGradient id="bezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="25%" stop-color="#0066FF" />
      <stop offset="65%" stop-color="#5522FA" />
      <stop offset="100%" stop-color="#9D2BFF" />
    </linearGradient>

    <!-- Flame Outer Gradient -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="30%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <!-- Flame Inner Luminous Core -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="60%" stop-color="#FFF4B8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 2 o'clock Wish Spark (Star) Gradient -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFCA00" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- Soft drop shadow for modern app depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0066FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Outer Gradient Ring / Medallion Rim -->
  <circle cx="60" cy="60" r="50" fill="url(#bezelGradient)" />

  <!-- 2. Inner Deep Midnight Navy Dial Face -->
  <circle cx="60" cy="60" r="43.5" fill="#081432" />

  <!-- 3. Four Cardinal Hour Markers (White Rounded Pills) -->
  <g fill="#FFFFFF">
    <!-- 12 o'clock -->
    <rect x="58.6" y="19.5" width="2.8" height="7" rx="1.4" />
    <!-- 3 o'clock -->
    <rect x="93.5" y="58.6" width="7" height="2.8" rx="1.4" />
    <!-- 6 o'clock -->
    <rect x="58.6" y="93.5" width="2.8" height="7" rx="1.4" />
    <!-- 9 o'clock -->
    <rect x="19.5" y="58.6" width="7" height="2.8" rx="1.4" />
  </g>

  <!-- 4. Sculptural Candle Body & 2 O'Clock Hand -->
  <g id="candleStructure">
    <!-- Lower Candle Column (towards 6h) with Semicircle Base -->
    <path d="M 55.4 60
             L 55.4 83
             C 55.4 85.5, 57.5 87.5, 60 87.5
             C 62.5 87.5, 64.6 85.5, 64.6 83
             L 64.6 60
             Z" 
          fill="#FFFFFF" />

    <!-- 2 o'clock Minute Hand (pointed at -30° towards star) -->
    <path d="M 58 57
             L 79.5 44.5
             C 81 43.6, 82.8 45.4, 81.8 47
             L 62.5 62
             Z" 
          fill="#FFFFFF" />

    <!-- Center White Hub -->
    <circle cx="60" cy="60" r="8" fill="#FFFFFF" />

    <!-- Inner Concentric Azure Blue Hub Circle -->
    <circle cx="60" cy="60" r="4.3" fill="#0080FF" />

    <!-- Center White Dot -->
    <circle cx="60" cy="60" r="1.7" fill="#FFFFFF" />
  </g>

  <!-- 5. Teardrop Candle Flame (Vibrant Warm Glow) -->
  <!-- Outer Flame -->
  <path d="M 60 27.5
           C 54.5 35, 51.5 42, 53 47.5
           C 54.5 52.5, 57.2 54.5, 60 54.5
           C 62.8 54.5, 65.5 52.5, 67 47.5
           C 68.5 42, 65.5 35, 60 27.5 Z" 
        fill="url(#flameOuter)" />

  <!-- Inner Soft Lemon/White Flame Core -->
  <path d="M 60 36.5
           C 57.5 41, 56.5 45, 57.5 48.5
           C 58.2 51, 59.1 52, 60 52
           C 60.9 52, 61.8 51, 62.5 48.5
           C 63.5 45, 62.5 41, 60 36.5 Z" 
        fill="url(#flameInner)" />

  <!-- 6. Celestial AI Wish Spark at 2 O'Clock (Point of Arrival) -->
  <g transform="translate(86.5, 41)">
    <!-- 4-Pointed Star -->
    <path d="M 0 -13.5
             Q 1.2 -2.5 8 0
             Q 1.2 2.5 0 13.5
             Q -1.2 2.5 -8 0
             Q -1.2 -2.5 0 -13.5 Z" 
          fill="url(#starGradient)" />

    <!-- Inner Bright Core Spark -->
    <path d="M 0 -5
             Q 0.5 -1 3 0
             Q 0.5 1 0 5
             Q -0.5 1 -3 0
             Q -0.5 -1 0 -5 Z" 
          fill="#FFFFFF" opacity="0.95" />

    <circle cx="0" cy="0" r="1.4" fill="#FFFFFF" />
  </g>
</svg>

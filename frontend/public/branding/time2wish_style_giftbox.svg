<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="giftBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="giftLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="starBurst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sparkles bursting from open box -->
  <!-- Micro confetti/stars -->
  <circle cx="28" cy="24" r="3" fill="#38BDF8" />
  <circle cx="92" cy="28" r="3.5" fill="#EC4899" />
  <circle cx="38" cy="14" r="2.5" fill="#FBBF24" />
  <circle cx="82" cy="12" r="2" fill="#38BDF8" />

  <!-- Big Central Star bursting out -->
  <g transform="translate(60, 22)" filter="url(#softShadow)">
    <path d="M 0 -18 Q 2 -4 16 0 Q 2 4 0 18 Q -2 4 -16 0 Q -2 -4 0 -18 Z" 
          fill="url(#starBurst)" />
    <!-- Secondary mini starlet -->
    <path d="M 0 -8 Q 1 -1.5 7 0 Q 1 1.5 0 8 Q -1 1.5 -7 0 Q -1 -1.5 0 -8 Z" 
          fill="#FFFFFF" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Main Box Body -->
  <rect x="28" y="52" width="64" height="48" rx="10" 
        fill="url(#giftBody)" filter="url(#softShadow)" />

  <!-- Vertical Ribbon on Body -->
  <rect x="53" y="52" width="14" height="48" 
        fill="url(#ribbonGrad)" />

  <!-- Horizontal Ribbon on Body -->
  <rect x="28" y="70" width="64" height="12" 
        fill="url(#ribbonGrad)" opacity="0.9" />

  <!-- Floating / Tilted Lid (Opening the surprise!) -->
  <g transform="translate(0, -4)">
    <rect x="24" y="42" width="72" height="14" rx="7" 
          fill="url(#giftLid)" filter="url(#softShadow)" />
    <!-- Lid Ribbon Band -->
    <rect x="53" y="42" width="14" height="14" 
          fill="url(#ribbonGrad)" />

    <!-- Ribbon Knot / Loops on Top -->
    <!-- Left Loop -->
    <path d="M 54 42 C 40 42, 38 30, 48 30 C 56 30, 58 38, 60 42 Z" 
          fill="url(#ribbonGrad)" />
    <!-- Right Loop -->
    <path d="M 66 42 C 80 42, 82 30, 72 30 C 64 30, 62 38, 60 42 Z" 
          fill="url(#ribbonGrad)" />
    <!-- Center Knot -->
    <circle cx="60" cy="42" r="5" fill="#F43F5E" />
    <circle cx="60" cy="42" r="2" fill="#FEF08A" />
  </g>
</svg>

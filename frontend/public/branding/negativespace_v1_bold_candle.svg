<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="v1Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="v1Flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="v1Star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="v1Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Solid Bold Medallion Base with Cyan-Purple Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#v1Badge)" filter="url(#v1Shadow)" />
  
  <!-- Subtle Outer Rim Reflection -->
  <circle cx="60" cy="60" r="47" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.35" />

  <!-- High-Visibility Negative Space Cutout Elements (Pure Crisp White) -->
  <g fill="#FFFFFF">
    <!-- Bold Cardinal Hour Ticks -->
    <rect x="58" y="16" width="4" height="9" rx="2" />
    <rect x="95" y="58" width="9" height="4" rx="2" />
    <rect x="58" y="95" width="4" height="9" rx="2" />
    <rect x="16" y="58" width="9" height="4" rx="2" />

    <!-- Bold Candle Body (Forms the 6 o'clock vertical hour stem) -->
    <rect x="54" y="52" width="12" height="34" rx="6" />

    <!-- Bold Minute Hand sweeping towards 2 o'clock -->
    <path d="M 59 58 L 81 36 C 83 34, 86 37, 84 39 L 63 62 Z" />

    <!-- Center Pivot Dot -->
    <circle cx="60" cy="58" r="4.5" fill="#0EA5E9" />
  </g>

  <!-- Candle Flame (High-Contrast Amber-Gold Tear/Diamond) -->
  <path d="M 60 26 C 52 36, 53 48, 60 48 C 67 48, 68 36, 60 26 Z" 
        fill="url(#v1Flame)" />
  <circle cx="60" cy="40" r="3" fill="#FFFFFF" />

  <!-- Radiant Wish Star at 2 o'clock (Positioned right at the end of the minute hand) -->
  <g transform="translate(86, 32)">
    <path d="M 0 -15 Q 1.5 -3 11 0 Q 1.5 3 0 15 Q -1.5 3 -11 0 Q -1.5 -3 0 -15 Z" 
          fill="url(#v1Star)" />
    <!-- Secondary Cross Flare -->
    <path d="M 0 -6 Q 0.6 -1 5 0 Q 0.6 1 0 6 Q -0.6 1 -5 0 Q -0.6 -1 0 -6 Z" 
          fill="#FFFFFF" transform="rotate(45)" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>
</svg>

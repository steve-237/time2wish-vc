<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="hgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="hgStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Top bar of hourglass -->
  <line x1="34" y1="26" x2="86" y2="26" 
        stroke="url(#hgGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Bottom bar of hourglass -->
  <line x1="34" y1="94" x2="86" y2="94" 
        stroke="url(#hgGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Left curved wall -->
  <path d="M 38 28 C 42 46, 52 54, 55 60 C 52 66, 42 74, 38 92" 
        fill="none" 
        stroke="url(#hgGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Right curved wall -->
  <path d="M 82 28 C 78 46, 68 54, 65 60 C 68 66, 78 74, 82 92" 
        fill="none" 
        stroke="url(#hgGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- The AI Wish Spark at the focal center -->
  <g transform="translate(60, 60)">
    <path d="M 0 -18 Q 1.5 -3.5 14 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -14 0 Q -1.5 -3.5 0 -18 Z" 
          fill="url(#hgStarGrad)" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>

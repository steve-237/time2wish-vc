<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c3LockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="c3LockStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="c3LockWish" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Left: Concept 3 Mark (Scaled) -->
  <g transform="translate(12, 10) scale(0.62)">
    <line x1="34" y1="26" x2="86" y2="26" stroke="url(#c3LockGrad)" stroke-width="5.5" stroke-linecap="round" />
    <line x1="34" y1="94" x2="86" y2="94" stroke="url(#c3LockGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 38 28 C 42 46, 52 54, 55 60 C 52 66, 42 74, 38 92" fill="none" stroke="url(#c3LockGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 82 28 C 78 46, 68 54, 65 60 C 68 66, 78 74, 82 92" fill="none" stroke="url(#c3LockGrad)" stroke-width="5" stroke-linecap="round" />
    <g transform="translate(60, 60)">
      <path d="M 0 -18 Q 1.5 -3.5 14 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -14 0 Q -1.5 -3.5 0 -18 Z" fill="url(#c3LockStar)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(95, 52)">
    <text font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="38" 
          font-weight="700" 
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Time</tspan>
      <tspan fill="#0EA5E9" font-weight="800">2</tspan>
      <tspan fill="url(#c3LockWish)">Wish</tspan>
    </text>
    
    <text x="2" y="20" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="2.8" 
          fill="#94A3B8" 
          text-transform="uppercase">THE PERFECT MOMENT TO WISH</text>
  </g>
</svg>

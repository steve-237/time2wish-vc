<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#161F33" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="sqBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="sqGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c3IconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="c3IconStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="c3IconFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#sqBg3)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#sqBorder3)" stroke-width="3" />

  <!-- Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="url(#sqGlow3)" />

  <!-- Centered Scaled Icon Mark -->
  <g transform="translate(256, 256) scale(3.1) translate(-60, -60)">
    <line x1="34" y1="26" x2="86" y2="26" stroke="url(#c3IconGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="34" y1="94" x2="86" y2="94" stroke="url(#c3IconGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M 38 28 C 42 46, 52 54, 55 60 C 52 66, 42 74, 38 92" fill="none" stroke="url(#c3IconGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 82 28 C 78 46, 68 54, 65 60 C 68 66, 78 74, 82 92" fill="none" stroke="url(#c3IconGrad)" stroke-width="4.5" stroke-linecap="round" />
    <g transform="translate(60, 60)" filter="url(#c3IconFilter)">
      <path d="M 0 -18 Q 1.5 -3.5 14 0 Q 1.5 3.5 0 18 Q -1.5 3.5 -14 0 Q -1.5 -3.5 0 -18 Z" fill="url(#c3IconStar)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>
</svg>

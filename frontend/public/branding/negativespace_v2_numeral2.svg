<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="v2Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="v2Star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="v2Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Solid Bold Medallion Base -->
  <circle cx="60" cy="60" r="50" fill="url(#v2Badge)" filter="url(#v2Shadow)" />
  <circle cx="60" cy="60" r="47" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.35" />

  <!-- Negative Space '2' with Integrated Candle Silhouette (Pure Crisp White) -->
  <path d="M 44 44 
           C 44 28, 54 22, 66 22 
           C 78 22, 86 30, 86 42 
           C 86 54, 76 66, 60 78 
           L 44 88 
           L 86 88" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Candle Pillar (Vertical axis in center) -->
  <rect x="55" y="44" width="10" height="28" rx="5" fill="url(#v2Badge)" />
  <rect x="57" y="46" width="6" height="24" rx="3" fill="#FFFFFF" opacity="0.9" />

  <!-- The AI Wish Spark Flame crowning the composition at 2 o'clock -->
  <g transform="translate(86, 26)">
    <path d="M 0 -16 Q 1.5 -3.5 13 0 Q 1.5 3.5 0 16 Q -1.5 3.5 -13 0 Q -1.5 -3.5 0 -16 Z" 
          fill="url(#v2Star)" />
    <!-- White center core -->
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
  </g>
</svg>
